<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}</style><script>window.CELSE_APP=true;</script></head><body><title>Celse Arenası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Düzen: tek sütunlu oyun alanı; üstte yapışkan duruşma çubuğu, altında sekmeler ve dosya kartları */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#e2e6ec; --ink:#151b26; --muted:#5a6476; --line:#d3d9e2;
  --accent:#8e1b30; --accent-ink:#ffffff; --accent-soft:#f5e3e6;
  --brass:#9a6c12; --brass-soft:#f6ecd6;
  --ok:#17784a; --ok-soft:#dff1e7; --bad:#b3262d; --bad-soft:#f8e0e1;
  --f-display:"Spectral", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#171d28; --sunk:#111621; --ink:#e7ebf1; --muted:#97a1b3; --line:#283141;
  --accent:#e5627a; --accent-ink:#1a0a0e; --accent-soft:#3a1720;
  --brass:#e3b553; --brass-soft:#33280f;
  --ok:#4cc68b; --ok-soft:#12301f; --bad:#f06b6f; --bad-soft:#3a1517; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#171d28; --sunk:#111621; --ink:#e7ebf1; --muted:#97a1b3; --line:#283141;
  --accent:#e5627a; --accent-ink:#1a0a0e; --accent-soft:#3a1720;
  --brass:#e3b553; --brass-soft:#33280f;
  --ok:#4cc68b; --ok-soft:#12301f; --bad:#f06b6f; --bad-soft:#3a1517; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Üst çubuk */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.online{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.online::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip-me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px 4px 4px;min-width:0}
.chip-me .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.chip-me span{font-weight:600;font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-me em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--brass)}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap{display:flex;gap:2px;padding-block:0}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:420px){.tab{padding:10px 8px;font-size:13px}.brand small{display:none}.chip-me span{max-width:90px}}
.chip-me em{white-space:nowrap}

main{padding-block:20px 48px}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted)}
.fine{font-size:11.5px;line-height:1.45;color:var(--muted);margin:2px 0 0;text-align:center}

/* Profil şeridi */
.profile{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.profile h2{font-size:26px}
.tier{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--brass);background:var(--brass-soft);padding:3px 8px;border-radius:4px}
.pts{text-align:right}
.pts b{display:block;font-family:var(--f-mono);font-size:28px;color:var(--brass);line-height:1}
.pts span{font-size:12px;color:var(--muted)}
.prog{grid-column:1/-1}
.prog .track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog .fill{height:100%;background:var(--brass);border-radius:3px;transition:width .6s}
.prog .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:700}

/* Branş seçici */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Dava kartları */
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.cases{grid-template-columns:1fr}}
.case{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:border-color .15s, transform .15s}
.case:hover{border-color:var(--accent);transform:translateY(-1px)}
.case .court{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.case h3{font-size:20px}
.case .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.dots{letter-spacing:2px;color:var(--brass)}

/* Dosya ekranı */
.docket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.docket header{padding:18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.docket header .tc{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.docket header h2{font-size:28px}
.docket .row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.docket .row b{color:var(--ink);font-weight:600}
.docket .facts{padding:18px;max-width:68ch}
.docket .facts p{margin:0}
.ev{display:grid;gap:0;border-top:1px solid var(--line)}
.ev div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.ev div:last-child{border-bottom:0}
.ev dt{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);padding-top:2px}
.ev dd{margin:0}
@media (max-width:560px){.ev div{grid-template-columns:1fr;gap:2px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* Oyun ekranı */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hud .step{font-family:var(--f-mono);font-size:12px;color:var(--muted);}
.hud .score{margin-left:auto;font-family:var(--f-mono);font-weight:700;color:var(--brass);font-size:18px}
.hud .streak{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:700}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
@media (max-width:560px){.stage{grid-template-columns:1fr}}
.clock{position:relative;width:84px;height:84px;flex:none}
.clock svg{width:84px;height:84px;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:7}
.clock .bgc{stroke:var(--sunk)}
.clock .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke .2s}
.clock.warn .fg{stroke:var(--bad)}
.clock b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:24px}
.clock.warn b{color:var(--bad)}
@media (max-width:560px){.clock{width:64px;height:64px}.clock svg{width:64px;height:64px}.clock b{font-size:19px}}
.qhead{display:flex;flex-direction:column;gap:6px;min-width:0}
.qhead h2{font-size:22px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:15px;transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt kbd{font-family:var(--f-mono);font-size:12px;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:var(--bg)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right kbd{border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong kbd{border-color:var(--bad);color:var(--bad)}
.verdict{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;border:1px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.no{background:var(--bad-soft);border-color:var(--bad)}
.verdict h3{font-size:19px}
.verdict.ok h3{color:var(--ok)} .verdict.no h3{color:var(--bad)}
.verdict p{margin:0;max-width:68ch}
.ref{align-self:flex-start;font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:4px}
details.file{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.file summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
details.file .inner{padding:0 14px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}

/* Sonuç */
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px}
.result .big{font-family:var(--f-mono);font-size:48px;font-weight:700;color:var(--brass);line-height:1}
.result h2{font-size:30px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:8px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-size:18px}
.recap{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.recap div{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.recap div:last-child{border-bottom:0}
.recap .y{color:var(--ok);font-weight:700}.recap .n{color:var(--bad);font-weight:700}
.promo{background:var(--brass-soft);color:var(--brass);border-radius:8px;padding:12px 14px;font-weight:700}

/* Ligler */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ladder div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ladder div.me{border-color:var(--brass);background:var(--brass-soft)}
.ladder b{font-family:var(--f-display);font-size:15px;line-height:1.15}
.ladder span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:560px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board table{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:left;font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line)}
.board td{padding:10px 14px;border-bottom:1px solid var(--line)}
.board tr:last-child td{border-bottom:0}
.board td.n,.board th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.board td.rk{font-family:var(--f-mono);color:var(--muted);width:44px}
.board tr.me td{background:var(--accent-soft)}
.board tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.board .nm{font-weight:600;overflow-wrap:anywhere}
.board .tt{font-size:12px;color:var(--muted)}
.medal{color:var(--brass);font-weight:700}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* Düello */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.code{font-family:var(--f-mono);font-size:34px;font-weight:700;color:var(--accent)}
input.txt{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input.code-in{font-family:var(--f-mono);font-size:20px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;text-align:center}
.vs .side{background:var(--bg);border-radius:8px;padding:14px;min-width:0}
.vs .side b{display:block;font-family:var(--f-mono);font-size:28px;color:var(--brass)}
.vs .side span{font-weight:600;overflow-wrap:anywhere}
.vs .side.win{outline:2px solid var(--brass)}
.vs i{font-family:var(--f-display);font-style:normal;font-weight:700;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:10px 12px;font-size:14px}
.list button:last-child{border-bottom:0}

/* Giriş */
.gate{max-width:440px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:14px}
.gate h1{font-size:40px;letter-spacing:-.01em}
.gate h1 i{font-style:normal;color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.banner{background:var(--brass-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13.5px}

/* Yasal metinler, pencere, onay kutuları, yönetim */
.legal{max-width:72ch;font-size:14.5px}
.legal h3{font-size:20px;margin:18px 0 6px}
.legal h4{font-family:var(--f-body);font-size:15px;font-weight:700;margin:16px 0 4px}
.legal p{margin:0 0 10px}
.legal ul,.legal ol{margin:0 0 10px;padding-left:22px}
.legal li{margin:2px 0}
.legal a{color:var(--accent)}
.tblwrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:8px}
.tblwrap table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
.tblwrap th,.tblwrap td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.tblwrap th{background:var(--bg);font-weight:600}
.tblwrap tr:last-child td{border-bottom:0}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.modal .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:780px;max-height:88vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:14px}}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:20px}
.modal .body{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.checks{display:flex;flex-direction:column;gap:10px}
.checks label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;line-height:1.45}
.checks input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.timeset{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.timeset .note{flex:1 1 220px;margin:0}
.flag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--bad-soft);color:var(--bad);margin:2px 4px 2px 0}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.adm{display:flex;flex-direction:column;gap:10px}
.adm .row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.adm .row .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.adm details{font-size:12.5px}
.adm .glog{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--bad);color:#fff}
textarea.txt{font:inherit;font-size:14px;width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.report{display:flex;flex-direction:column;gap:8px;align-self:stretch}

.daily{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:16px 18px}
.daily h3{font-family:var(--f-display);font-size:22px;margin:2px 0 4px}
.daily .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--muted)}
.daily .dstreak{text-align:center;min-width:72px}
.daily .dstreak b{display:block;font-family:var(--f-display);font-size:34px;line-height:1;color:var(--brass)}
.daily .dstreak span{font-size:12px;color:var(--muted)}
.daily .actions{grid-column:1/-1;margin:0}

<script>
// ===== Dava dosyaları ve soru havuzu =====
// Her karar: q soru, o şıklar, a doğru şık (yazım sırası), e gerekçe, r mevzuat, t süre (sn)
const CASES = [
  // ---------------- CEZA ----------------
  {
    id: 'c1', b: 'ceza', title: 'Gece Bahçesinde Bıçak', court: 'Ankara 21. Asliye Ceza Mahkemesi', esas: '2026/1482 E.', role: 'Hâkim', zorluk: 2,
    intro: "Sanık Aydın K., 14 Mart 2026 gecesi saat 02.10'da elinde bıçakla bahçesine giren ve evin kapısını zorlayan Mert S.'yi göğsünden itip yere düşürdü. Mert S. başını bahçe taşına çarparak yaralandı. İddianamede TCK m.86 uyarınca kasten yaralama suçundan cezalandırma isteniyor.",
    evidence: [
      ['Komşu kamerası', "Mert S. bıçağı önde tutarak kapıya yürüyor ve kapıyı tekmeliyor. Sanık kapıyı açıp onu bir kez itiyor, ardından hemen geri çekiliyor."],
      ['Adli tıp raporu', "Mert S.'de kafa derisinde 4 cm kesi. Yaralanma basit tıbbi müdahaleyle giderilebilir; hayati tehlike yok."],
      ['Tanık Selma K.', '"Mert kapıyı tekmeliyor, \'çıkın dışarı\' diye bağırıyordu. Çok korktuk."'],
      ['Sanık savunması', '"Eşimi korumak için ittim, başka bir şey yapmadım."']
    ],
    steps: [
      { q: 'Sanığın eylemini değerlendirirken önce hangi kurumu incelersin?', o: ['Haksız tahrik (TCK m.29)', 'Meşru savunma (TCK m.25/1)', 'Zorunluluk hâli (TCK m.25/2)', 'Hakkın kullanılması (TCK m.26)'], a: 1,
        e: 'Kendisine veya başkasına yönelik haksız, gerçekleşen ya da tekrarı muhtemel bir saldırıyı o anki durumla orantılı biçimde defetmek zorunluluğuyla hareket eden kişiye ceza verilmez. Haksız tahrik ise yalnızca cezayı indirir; hukuka uygunluk nedeni değildir.', r: 'TCK m.25/1' },
      { q: 'Kamera, itişin saldırıyla orantılı olduğunu ve sanığın hemen geri çekildiğini gösteriyor. Hüküm ne olmalı?', o: ['Ceza verilmesine yer olmadığına', 'Davanın düşmesine', 'Beraat', 'Mahkûmiyet, TCK m.29 indirimiyle'], a: 2,
        e: 'Meşru savunma bir hukuka uygunluk nedenidir; fiil baştan hukuka uygundur. Bu durumda beraat kararı verilir. Kusurluluğu kaldıran nedenler ise "ceza verilmesine yer olmadığı" kararına yol açar.', r: 'CMK m.223/2-d' },
      { q: 'Farklı senaryo: Mert yere düşüp bıçak elinden kaçtıktan sonra sanık panikle iki tekme daha atsaydı ve bu, mazur görülebilir korkudan kaynaklansaydı?', o: ['Sınır mazur görülebilir korkuyla aşılmıştır; ceza verilmez', 'Ceza üçte bir oranında indirilir', 'Meşru savunma düşer, tam ceza verilir', 'Haksız tahrik hükümleri uygulanır'], a: 0,
        e: 'Hukuka uygunluk nedenlerinde sınırın mazur görülebilir heyecan, korku veya telaştan dolayı aşılması hâlinde faile ceza verilmez. Bu bir kusurluluk sorunudur; hüküm "ceza verilmesine yer olmadığı" olur.', r: 'TCK m.27/2 · CMK m.223/3' },
      { q: 'Kolluk, olay gecesi hâkim kararı ve savcı emri olmadan sanığın evini aradı, ruhsatsız bir tabanca buldu. Tabanca hükme esas alınabilir mi?', o: ['Evet, suçüstü hâli olduğu için', 'Evet, sanık itiraz etmezse', 'Hayır, hukuka aykırı elde edilen delil hükme esas alınamaz', 'Yalnızca bilirkişi raporu alınırsa'], a: 2,
        e: 'Konutta arama ancak hâkim kararıyla, gecikmesinde sakınca varsa Cumhuriyet savcısının yazılı emriyle yapılır; konutta kolluk amirinin emriyle arama yapılamaz. Kanuna aykırı elde edilen bulgu delil olarak kabul edilemez.', r: 'AY m.38/6 · CMK m.119, 206/2-a, 217/2' }
    ]
  },
  {
    id: 'c2', b: 'ceza', title: 'Tezgâhtaki Telefon', court: 'İzmir 7. Asliye Ceza Mahkemesi', esas: '2026/903 E.', role: 'Hâkim', zorluk: 1,
    intro: 'Sanık Burak T., 3 Haziran 2026 öğleden sonra bir telefon mağazasında tezgâhta duran teşhir telefonunu çantasına koydu ve ödeme yapmadan çıktı. Telefon, soruşturma aşamasında sanık tarafından sağlam olarak iade edildi.',
    evidence: [
      ['Mağaza kamerası', 'Sanık etrafı kolaçan edip telefonu çantasına koyuyor. Kimseye güç kullanılmıyor, kimseyle konuşmuyor.'],
      ['Mağaza müdürü', '"Telefon iki gün sonra polis aracılığıyla eksiksiz geri geldi. Zararımız kalmadı."'],
      ['Adli sicil', 'Kaydı yok.'],
      ['Sanık savunması', '"Pişmanım. Aynı gün geri vermek istedim ama korktum."']
    ],
    steps: [
      { q: 'Eylemin suç vasfı nedir?', o: ['Yağma (TCK m.148)', 'Hırsızlık (TCK m.141/1)', 'Güveni kötüye kullanma (TCK m.155)', 'Dolandırıcılık (TCK m.157)'], a: 1,
        e: 'Zilyedinin rızası olmadan taşınır malın bulunduğu yerden alınması hırsızlıktır. Cebir yok (yağma değil), mal sanığa teslim edilmemiş (güveni kötüye kullanma değil), hileli davranış yok (dolandırıcılık değil).', r: 'TCK m.141/1' },
      { q: 'Basit hırsızlığın kanundaki ceza aralığı?', o: ['6 ay – 2 yıl', '2 – 5 yıl', '1 – 3 yıl', '3 – 7 yıl'], a: 2,
        e: 'Zilyedinin rızası olmadan başkasına ait taşınır malı alan kişi bir yıldan üç yıla kadar hapis cezasıyla cezalandırılır.', r: 'TCK m.141/1' },
      { q: 'Telefon soruşturma aşamasında aynen iade edildi, zarar tamamen giderildi. Etkin pişmanlık indirimi?', o: ['Yarısına kadar indirim', 'Üçte ikisine kadar indirim', 'Üçte bire kadar indirim', 'Ceza verilmez'], a: 1,
        e: 'Suç tamamlandıktan sonra, kovuşturma başlamadan önce zarar aynen iade veya tazminle tamamen giderilirse ceza üçte ikisine kadar indirilir. Kovuşturma başladıktan sonra, hükümden önce olsaydı indirim yarısına kadar olurdu.', r: 'TCK m.168/1-2' },
      { q: 'Sonuç ceza 4 ay hapis. Bu ceza kanun anlamında nasıl nitelenir?', o: ['Uzun süreli hapis cezası', 'Adli para cezası', 'Güvenlik tedbiri', 'Kısa süreli hapis cezası'], a: 3,
        e: 'Hükmedilen bir yıl veya daha az süreli hapis cezası kısa süreli hapis cezasıdır ve adli para cezası gibi seçenek yaptırımlara çevrilebilir.', r: 'TCK m.49/2, m.50' }
    ]
  },
  {
    id: 'c3', b: 'ceza', title: 'Kayıttaki Ses', court: 'Bursa 4. Asliye Ceza Mahkemesi', esas: '2026/611 E.', role: 'Hâkim', zorluk: 3,
    intro: 'Katılan Elif D., eski iş ortağı sanık Cem A.\'nın kendisini aylardır telefonla tehdit ettiğini, son görüşmede "seni de çocuklarını da yaşatmam" dediğini ve bu görüşmeyi sanığın bilgisi dışında telefonuna kaydettiğini beyan etti.',
    evidence: [
      ['Ses kaydı', 'Sanığın sesiyle "seni de çocuklarını da yaşatmam" cümlesi duyuluyor. Kayıt görüşme sırasında katılan tarafından alınmış.'],
      ['HTS kaydı', 'İlgili saatte iki hat arasında 6 dakikalık görüşme var.'],
      ['Sanık savunması', '"Kayıt benim rızam olmadan alındı, delil olamaz. Başka bir şey söylemeyeceğim."']
    ],
    steps: [
      { q: 'Katılanın gizlice aldığı ses kaydı delil olarak değerlendirilebilir mi?', o: ['Hayır, rıza olmadığı için her durumda hukuka aykırıdır', 'Yalnızca savcı onaylarsa', 'Evet; anlık suçta başka delil imkânı olmayan mağdurun kaydı hukuka uygun kabul edilir', 'Sadece tanıkla desteklenirse'], a: 2,
        e: "Yargıtay Ceza Genel Kurulu'na göre, kişiye karşı o anda işlenen bir suçta başka türlü delil elde etme ve yetkililere başvurma imkânı olmayan mağdurun konuşmayı kaydetmesi hukuka uygundur. Mağdurun buluşma ayarlayıp konuşmayı yönlendirerek sonradan delil \"yaratması\" ise hukuka aykırıdır ve hükme esas alınamaz.", r: 'Yargıtay CGK 01.12.2020, E.2018/39, K.2020/485 · CMK m.217/2' },
      { q: '"Seni de çocuklarını da yaşatmam" sözü hangi tehdit türüdür?', o: ['Hayata yönelik tehdit; 6 ay – 2 yıl hapis', 'Malvarlığına yönelik tehdit, şikâyete bağlı', 'Hakaret', 'Şantaj'], a: 0,
        e: 'Kişinin kendisinin veya yakınının hayatına, vücut ya da cinsel dokunulmazlığına saldırı gerçekleştireceğinden bahisle tehdit altı aydan iki yıla kadar hapis gerektirir. Malvarlığına büyük zarar veya sair kötülük tehdidi ise şikâyete bağlıdır.', r: 'TCK m.106/1' },
      { q: 'Sanık duruşmada soruları cevaplamayı reddetti. Bu susma nasıl değerlendirilir?', o: ['Suçun ikrarı sayılır', 'Aleyhine yorumlanır', 'Duruşmaya ara verilip beyana zorlanır', 'Susma hakkıdır, aleyhine delil sayılamaz'], a: 3,
        e: 'Sanık yüklenen suç hakkında açıklamada bulunmama hakkına sahiptir ve bu hak kendisine hatırlatılır. Susmanın aleyhe yorumlanması adil yargılanma hakkını ihlal eder.', r: 'AY m.38/5 · CMK m.147/1-e' },
      { q: 'Katılan yalnızca şikâyete bağlı bir tehdidi, fiili ve faili öğrendikten 7 ay sonra şikâyet etseydi?', o: ['Zamanaşımı dolana kadar şikâyet edilebilir', 'Şikâyet süresi geçmiştir; dava düşer', 'Şikâyet süresi 1 yıldır, sorun yok', 'Savcı re\'sen devam eder'], a: 1,
        e: 'Şikâyete bağlı suçlarda şikâyet, fiil ve failin öğrenildiği günden itibaren altı ay içinde yapılmalıdır. Süre geçmişse kovuşturma şartı gerçekleşmez ve düşme kararı verilir.', r: 'TCK m.73/1 · CMK m.223/8' }
    ]
  },
  {
    id: 'c4', b: 'ceza', title: 'Ekrana Bakan Sürücü', court: 'Konya 3. Asliye Ceza Mahkemesi', esas: '2026/1207 E.', role: 'Hâkim', zorluk: 3,
    intro: "Sanık Deniz Y., 22 Ağustos 2026'da şehir içinde araç kullanırken telefonundaki mesaja baktı ve kırmızı ışıkta duran araca arkadan çarptı. Yan koltukta oturan babası Hasan Y. hayatını kaybetti. Başka yaralanan yok.",
    evidence: [
      ['Kaza tespit tutanağı', 'Sürücü asli kusurlu. Hız sınırı aşılmamış, alkol 0,00 promil.'],
      ['Telefon incelemesi', 'Çarpışmadan 4 saniye önce bir mesajlaşma uygulaması açılmış.'],
      ['Sanık savunması', '"Babamı ben öldürdüm. Her gün bununla yaşıyorum."']
    ],
    steps: [
      { q: 'Sanığın kusur türü nedir?', o: ['Olası kast', 'Bilinçli taksir', 'Doğrudan kast', 'Basit taksir'], a: 3,
        e: 'Sanık dikkat ve özen yükümlülüğüne aykırı davranmış, ancak sonucu öngördüğüne dair veri yok. Öngörülebilir sonucun öngörülmemesi basit taksirdir. Öngörüp istememek bilinçli taksir, öngörüp kabullenmek olası kast olurdu.', r: 'TCK m.22/2' },
      { q: 'Babasının ölümü nedeniyle taksirle öldürme suçundan nasıl karar verirsin?', o: ['Ceza verilmesine yer olmadığına', 'Mahkûmiyet, altıda bir indirimle', 'Beraat', 'Davanın düşmesine'], a: 0,
        e: 'Taksirli hareketin sonucu münhasıran failin kişisel ve ailevi durumu bakımından cezaya hükmedilmesini gereksiz kılacak derecede mağduriyete yol açmışsa ceza verilmez. Bilinçli taksirde ise ceza yalnızca yarıdan altıda bire kadar indirilebilir.', r: 'TCK m.22/6 · CMK m.223/3' },
      { q: 'Farklı senaryo: Kazada yalnızca arka koltuktaki arkadaşı, basit tıbbi müdahaleyle giderilebilecek şekilde yaralansaydı ve şikâyetçi olmasaydı?', o: ['Kovuşturma re\'sen sürer', 'Uzlaştırma zorunludur, aksi hâlde mahkûmiyet', 'Şikâyet yokluğundan düşme kararı verilir', 'Beraat kararı verilir'], a: 2,
        e: 'Taksirle yaralama şikâyete bağlıdır (bilinçli taksirle işlenen, basit yaralamayı aşan hâller hariç). Şikâyet yoksa kovuşturma şartı gerçekleşmez ve dava düşer.', r: 'TCK m.89/5 · CMK m.223/8' },
      { q: 'Başka bir sürücü şehir içinde 150 km/s hızla giderken çarpabileceğini öngörmüş ama "iyi sürücüyüm, olmaz" diye güvenmiş olsaydı?', o: ['Basit taksir', 'Olası kast', 'Bilinçli taksir; ceza üçte birden yarısına kadar artırılır', 'Kast yok, beraat'], a: 2,
        e: 'Kişinin öngördüğü sonucu istememesine karşın neticenin meydana gelmesi bilinçli taksirdir ve ceza üçte birden yarısına kadar artırılır. Sonucu "olursa olsun" diye kabullenseydi olası kast olurdu.', r: 'TCK m.22/3' }
    ]
  },

  // ---------------- İŞ ----------------
  {
    id: 'i1', b: 'is', title: 'On İki Saatlik Vardiya', court: 'İstanbul Anadolu 9. İş Mahkemesi', esas: 'Dava öncesi', role: 'İşçi vekili', zorluk: 2,
    intro: "Müvekkil Fatma Ö. bir lojistik deposunda 4 yıl 2 ay çalıştı. Haftada 6 gün 08.00–20.00 arası çalıştı, her gün 1 saat ara dinlenme kullandı. Son brüt ücreti 42.000 TL. İşveren 10 Ekim 2026'da \"devamsızlık\" gerekçesiyle sözleşmeyi bildirimsiz feshetti; devamsızlık tutanağı yok.",
    evidence: [
      ['PDKS kayıtları', 'Fesihten önceki 3 ayda devamsızlık yok. Giriş 07.52–08.05, çıkış 20.00–20.15.'],
      ['Bordrolar', 'Fazla çalışma tahakkuku yok; bordrolar işçiye hiç imzalatılmamış.'],
      ['Tanık (vardiya amiri)', '"Depoda herkes 12 saat çalışır, fazla mesai ödenmez."'],
      ['Fesih bildirimi', '"Devamsızlık." Tarih ve gün belirtilmemiş.']
    ],
    steps: [
      { q: 'Kıdem, ihbar ve fazla çalışma alacakları için dava açmadan önce ne yapmalısın?', o: ['Noter ihtarı çekmek', 'Doğrudan iş mahkemesinde dava açmak', "İŞKUR'a şikâyet etmek", 'Arabulucuya başvurmak (dava şartı)'], a: 3,
        e: 'Kanuna, bireysel veya toplu iş sözleşmesine dayanan işçi alacağı ve tazminatı ile işe iade taleplerinde arabulucuya başvurulmuş olması dava şartıdır. Doğrudan açılan dava usulden reddedilir.', r: '7036 s. K. m.3/1' },
      { q: 'Haftada 6 gün, günde 12 saat, günlük 1 saat ara dinlenme. Haftalık fazla çalışma kaç saat?', o: ['27 saat', '21 saat', '15 saat', '24 saat'], a: 1, t: 20,
        e: 'Günlük fiili çalışma 12 − 1 = 11 saat; haftalık 6 × 11 = 66 saat. 45 saati aşan 21 saat fazla çalışmadır ve her saati yüzde elli zamlı ödenir.', r: 'İş K. m.41, 63, 68' },
      { q: 'Bordrolar imzasız ve fazla çalışma tahakkuku içermiyor. Fazla çalışmanın ispat yükü kimde ve nasıl ispatlanır?', o: ['İşverende; işçi hiçbir şey ispatlamaz', 'İşçide; tanık ve PDKS kayıtları gibi delillerle ispatlanabilir', 'İşçide; yalnızca yazılı belgeyle', 'Mahkeme re\'sen araştırır, ispat yükü yoktur'], a: 1,

      { q: '31 Temmuz 2026 sonrası açılacak davada fazla çalışma alacağının tutarı tam bilinmiyor. Hangi stratejiyi seçersin?', o: ['Belirsiz alacak davası (HMK m.107)', 'Kısmi dava; tahkikat sonuna kadar bir defaya mahsus artırım', 'Önce tespit, sonra eda davası', 'Her aşamada sınırsız ıslah'], a: 1,

      { q: 'Fazla çalışma ücreti alacağında zamanaşımı?', o: ['1 yıl', '2 yıl', '5 yıl', '10 yıl'], a: 2,
        e: 'Ücret alacakları ile kıdem, ihbar ve yıllık izin ücreti gibi alacaklar beş yıllık zamanaşımına tabidir.', r: 'TBK m.147/1 · İş K. Ek m.3' }
    ]

  {

  {

      { q: 'Feshi beklemeden, ücreti ödenmeyen müvekkil başka ne yapabilir?', o: ['İş görmekten kaçınabilir (ödeme gününden itibaren 20 gün geçtiyse)', 'İşyerindeki malzemeyi alıkoyabilir', 'Yalnızca suç duyurusunda bulunabilir', 'Hiçbir şey'], a: 0,

      { q: '3 yıl 6 aylık kıdem için yıllık ücretli izin süresi?', o: ['20 gün', '14 gün', '26 gün', '18 gün'], a: 1,
        e: 'Hizmet süresi bir yıldan beş yıla kadar (beş yıl dahil) olanlara on dört günden az olmamak üzere yıllık izin verilir. Kullanılmayan izin ücreti sözleşme sona erince ödenir.', r: 'İş K. m.53, 59' }
    ]

        e: 'Yürütmenin durdurulması, idari işlemin uygulanması hâlinde telafisi güç veya imkânsız zararların doğması ve işlemin açıkça hukuka aykırı olması şartlarının birlikte gerçekleşmesine bağlıdır.', r: 'İYUK m.27/2' },
      { q: 'Mahkeme kapatma kararının "neden aykırı bulunduğunu" yerine koyup "bence 1 ay kapatmak daha uygun olurdu" diyebilir mi?', o: ['Evet, ölçülülük gereği', 'Hayır; idari yargı yerindelik denetimi yapamaz, idari eylem ve işlem niteliğinde karar veremez', 'Evet, yalnızca istinafta', 'Sadece bilirkişi önerirse'], a: 1,
        e: 'İdari yargı yetkisi idari eylem ve işlemlerin hukuka uygunluğunun denetimiyle sınırlıdır. İdari mahkemeler yerindelik denetimi yapamaz, idarenin takdir yetkisini kaldıracak veya idari işlem niteliğinde karar veremez.', r: 'İYUK m.2/2' },
      { q: 'İdare mahkemesi işlemi iptal etti, bölge idare mahkemesi istinafı reddetti. İdare Danıştay\'a temyiz başvurusu yapabilir mi?', o: ['Hayır, BİM kararları her zaman kesindir', 'Evet; ticari faaliyeti süresiz engelleyen işlemlere karşı davalarda BİM kararı temyiz edilebilir', 'Yalnızca parasal sınır aşılırsa', 'Yalnızca Danıştay izin verirse'], a: 1,
        e: 'Belli bir ticari faaliyeti süresiz veya otuz gün ya da daha uzun süre engelleyen işlemlere karşı açılan iptal davalarında bölge idare mahkemesi kararlarına karşı, tebliğden itibaren otuz gün içinde Danıştay\'da temyiz yoluna gidilebilir.', r: 'İYUK m.46/1-e' }
    ]
  },
  {
    id: 'd2', b: 'idare', title: 'Karında Unutulan Gazlı Bez', court: 'Ankara 9. İdare Mahkemesi', esas: 'Dava öncesi', role: 'Davacı vekili', zorluk: 3,
    intro: "Müvekkil Nesrin A. 10 Ocak 2026'da bir devlet hastanesinde safra kesesi ameliyatı oldu. Aylarca süren karın ağrısından sonra 2 Haziran 2026'da yapılan tetkiklerde karnında gazlı bez unutulduğu anlaşıldı; ikinci bir ameliyat gerekti. Müvekkil ameliyatı yapan hekime dava açmak istiyor.",
    evidence: [
      ['Tomografi raporu', '02.06.2026: Batın içinde yabancı cisim (cerrahi gazlı bez) ile uyumlu görünüm.'],
      ['Epikriz', 'Yabancı cisim ikinci ameliyatla çıkarıldı; 3 hafta hastanede yatış.'],
      ['Gelir belgesi', 'Müvekkil serbest çalışan grafik tasarımcı; 4 ay çalışamadı.']
    ],
    steps: [
      { q: 'Tazminat davası kime karşı açılmalı?', o: ['Doğrudan ameliyatı yapan hekime, asliye hukukta', 'İdareye (Sağlık Bakanlığı); hekime ancak idare rücu edebilir', 'Hastane başhekimine şahsen', 'Hem hekime hem idareye, aynı davada'], a: 1,
        e: 'Kamu görevlilerinin yetkilerini kullanırken işledikleri kusurlardan doğan tazminat davaları, rücu edilmek kaydıyla ve kanunun gösterdiği şekle uygun olarak, ancak idare aleyhine açılabilir.', r: 'AY m.129/5 · İYUK m.2/1-b' },
      { q: 'İdari eylemden doğan zarar için dava açmadan önce ne yapmalısın?', o: ['Doğrudan dava açarım', 'Öğrenmeden itibaren 1 yıl ve her hâlde eylemden itibaren 5 yıl içinde idareye başvururum', 'Önce arabulucuya giderim', 'Valiliğe şikâyet ederim'], a: 1,
        e: 'İdari eylemlerden hakları ihlal edilmiş olanlar, eylemi öğrendikleri tarihten itibaren bir yıl ve her hâlde eylem tarihinden itibaren beş yıl içinde ilgili idareye başvurarak haklarının yerine getirilmesini istemek zorundadır.', r: 'İYUK m.13/1' },
      { q: 'Başvurudan sonra 30 gün geçti, idare cevap vermedi. Ne olur?', o: ['İstek kabul edilmiş sayılır', 'İstek reddedilmiş sayılır; bu tarihten itibaren dava açma süresi içinde (60 gün) dava açılır', 'İdare cevap verene kadar beklenir', 'Süre 60 güne uzar'], a: 1,
        e: 'İlgililerin idareye başvurusuna otuz gün içinde cevap verilmezse istek reddedilmiş sayılır. Zımni ret üzerine dava açma süresi içinde idari yargıya başvurulur.', r: 'İYUK m.10/2 (7331 s. K.), m.13/1' },
      { q: 'İdarenin sorumluluğunun dayanağı nedir?', o: ['Hekimin kişisel kusuru; idare sorumlu değil', 'Hizmet kusuru; sağlık hizmeti kötü işlemiş', 'Sosyal risk ilkesi', 'Hiçbiri; tıbbi komplikasyon'], a: 1,
        e: 'Ameliyatta yabancı cisim unutulması hizmetin kötü işlemesidir ve idarenin hizmet kusuru olarak değerlendirilir. İdare, kendi eylem ve işlemlerinden doğan zararı ödemekle yükümlüdür.', r: 'AY m.125/son' },
      { q: 'Bilirkişi zararı daha yüksek hesapladı, talebini artırdın. Artırılan kısma faiz hangi tarihten işler?', o: ['Artırım dilekçesinin verildiği tarihten', 'Karar tarihinden', 'Dava dilekçesindeki miktar için faiz hangi tarihten işletiliyorsa o tarihten', 'Faiz istenemez'], a: 2, t: 20,
        e: 'Danıştay İçtihatları Birleştirme Kurulu\'na göre tam yargı davalarında miktar artırımı yapılan kısım için de, dava dilekçesinde talep edilen miktar için faize hangi tarihten hükmedilecekse o tarihten faiz uygulanır.', r: 'Danıştay İDDK E.2021/5, K.2024/2 · RG 16.04.2025/32872' }
    ]
  },
  {
    id: 'd3', b: 'idare', title: 'Komşu Parseldeki Kule', court: 'İstanbul 6. İdare Mahkemesi', esas: '2026/1311 E.', role: 'Davacı vekili', zorluk: 3,
    intro: "Belediye, müvekkil Ayşe K.'nin evinin bitişiğindeki parselde kat yüksekliğini 4'ten 18'e çıkaran imar planı değişikliğini 2 Mart 2026'da askıya çıkardı. Müvekkil ilanı fark etmedi. 15 Eylül 2026'da plana dayanılarak komşu parseldeki X İnşaat A.Ş.'ye yapı ruhsatı verildi.",
    evidence: [
      ['Askı ilanı', 'Plan değişikliği 02.03.2026–02.04.2026 arasında belediye ilan panosunda askıda kaldı.'],
      ['Yapı ruhsatı', '15.09.2026 tarihli, 18 katlı konut için.'],
      ['Tapu kaydı', 'Müvekkilin taşınmazı plan değişikliği yapılan parselle sınır komşusu.']
    ],
    steps: [
      { q: 'Müvekkilin bu plana karşı dava açma ehliyeti var mı?', o: ['Hayır, yalnızca plan alanındaki malikler dava açabilir', 'Evet; komşu parsel maliki olarak menfaati ihlal edilmiştir', 'Herkes, menfaat aranmaksızın dava açabilir', 'Yalnızca muhtarlık açabilir'], a: 1,
        e: 'İptal davası, idari işlem nedeniyle menfaati ihlal edilenler tarafından açılır. Plan değişikliğinden doğrudan etkilenen komşu taşınmaz malikinin kişisel, meşru ve güncel menfaati bulunur.', r: 'İYUK m.2/1-a' },
      { q: 'İlanı gereken düzenleyici işlemlerde dava açma süresi ne zaman başlar?', o: ['İlgilinin öğrendiği günden', 'İlan tarihini izleyen günden', 'Askının bittiği günden', 'İşlemin uygulandığı günden'], a: 1,
        e: 'İlanı gereken düzenleyici işlemlerde dava süresi, ilan tarihini izleyen günden itibaren başlar.', r: 'İYUK m.7/4' },
      { q: 'Plana karşı 60 günlük süre kaçtı. Şimdi ne yapabilirsin?', o: ['Hiçbir şey; plan kesinleşti', 'Plana dayanan yapı ruhsatına karşı, ruhsatla birlikte plana da dava açabilirim', 'Yalnızca tazminat isteyebilirim', 'Sadece valiliğe itiraz edebilirim'], a: 1,
        e: 'Düzenleyici işleme karşı doğrudan dava açılmamış olması, bu işlemin uygulanması üzerine ilgilinin uygulama işlemiyle birlikte düzenleyici işleme de dava açmasına engel olmaz.', r: 'İYUK m.7/4' },
      { q: 'X İnşaat davaya idare yanında müdahil oldu. Mahkeme planı iptal etti; belediye istinafa gitmedi. Müdahil tek başına istinaf yoluna başvurabilir mi?', o: ['Hayır, müdahil asıl tarafa bağlıdır', 'Evet; katıldığı tarafın tutum ve beyanlarına aykırı olmamak kaydıyla', 'Yalnızca davacı izin verirse', 'Yalnızca Danıştay\'a temyizle'], a: 1,
        e: 'Danıştay İçtihatları Birleştirme Kurulu\'na göre idari yargıda müdahil, yanında katıldığı taraf kanun yoluna başvurmasa da, o tarafın tutum ve beyanlarına aykırı olmamak kaydıyla tek başına kanun yoluna başvurabilir.', r: 'Danıştay İDDK E.2021/4, K.2023/1' },
      { q: 'Bölge idare mahkemesinin imar planına ilişkin kararı Danıştay\'da temyiz edilebilir mi?', o: ['Hayır, kesindir', 'Evet; imar planlarından doğan davalarda temyiz yolu açıktır', 'Yalnızca parasal sınırı aşarsa', 'Yalnızca Bakanlık başvurabilir'], a: 1,
        e: 'İmar planları ve parselasyon işlemlerinden doğan davalarda bölge idare mahkemesi kararlarına karşı tebliğden itibaren otuz gün içinde Danıştay\'da temyiz yoluna gidilebilir.', r: 'İYUK m.46/1-g' }
    ]
  },

  {
    id: 'b1', b: 'borclar', title: 'Oğlum Evlenecek', court: 'Kadıköy 2. Sulh Hukuk Mahkemesi', esas: 'Dava öncesi', role: 'Kiracı vekili', zorluk: 2,
    intro: "Müvekkil Murat Y., 1 Kasım 2022'den beri 1 yıl süreli, her yıl kendiliğinden uzayan bir konut kira sözleşmesiyle oturuyor. Ev sahibi, \"oğlum evlenecek, eve o girecek\" diyerek müvekkilin evi 1 Kasım 2026'da boşaltmasını istiyor. Ayrıca yeni dönem için kirayı yüzde 70 artırmak istiyor.",
    evidence: [
      ['Kira sözleşmesi', 'Başlangıç 01.11.2022; süre 1 yıl. Aynı gün imzalanmış, tarihi boş bırakılmış bir "tahliye taahhüdü" ekli.'],
      ['Ev sahibinin mesajı', '"Sözleşme bitiyor, çıkman lazım. Kalacaksan kira yüzde 70 artacak."'],
      ['Nüfus kaydı', 'Ev sahibinin oğlu 27 yaşında, nişanlı.']
    ],
    steps: [
      { q: 'Ev sahibi "sözleşme süresi bitti" diye müvekkili çıkarabilir mi?', o: ['Evet, belirli süreli sözleşme sona erdi', 'Hayır; kiracı 15 gün önce bildirmedikçe sözleşme 1 yıl uzar ve kiraya veren süre bitimine dayanarak feshedemez', 'Evet, 3 ay önceden ihtarla', 'Yalnızca 5 yıl dolduysa'], a: 1,
        e: 'Konut ve çatılı işyeri kiralarında kiracı, belirli süreli sözleşmenin bitiminden en az on beş gün önce bildirimde bulunmadıkça sözleşme aynı koşullarla bir yıl uzar. Kiraya veren, sözleşme süresinin bitimine dayanarak sözleşmeyi sona erdiremez; ancak on yıllık uzama süresinin sonunda sebep göstermeden fesih imkânı doğar.', r: 'TBK m.347/1' },
      { q: 'Yüzde 70 artış talebine karşı hukuki sınır nedir?', o: ['Taraflar serbest; sınır yok', 'Bir önceki kira yılında TÜFE\'nin on iki aylık ortalamalarına göre değişim oranı', 'Asgari ücret artışı', 'ÜFE\'nin yıllık değişimi'], a: 1,
        e: 'Yenilenen kira dönemlerinde kararlaştırılacak kira bedeline ilişkin anlaşmalar, bir önceki kira yılında tüketici fiyat endeksindeki on iki aylık ortalamalara göre değişim oranını geçmemek koşuluyla geçerlidir.', r: 'TBK m.344/1' },
      { q: 'Sözleşmeyle aynı gün imzalatılan tahliye taahhüdü geçerli mi?', o: ['Evet, yazılı olduğu için', 'Hayır; tahliye taahhüdü kiralananın tesliminden sonra yazılı olarak verilmelidir', 'Evet, noter onayı varsa', 'Yalnızca işyerlerinde geçersizdir'], a: 1,
        e: 'Kiracı, kiralananın tesliminden sonra kiralananı belli bir tarihte boşaltmayı yazılı olarak üstlenmişse kiraya veren bu tarihte sözleşmeyi sona erdirebilir. Sözleşmeyle birlikte, teslimden önce alınan taahhüt bu koşulu taşımaz.', r: 'TBK m.352/1' },
      { q: 'Ev sahibi oğlunun konut ihtiyacına dayanarak tahliye davası açmak isterse, sözleşme süresi 1 Kasım 2026\'da bitiyorsa dava süresi?', o: ['Herhangi bir zamanda', 'Sürenin bitiminden itibaren 1 ay içinde', 'Sürenin bitiminden itibaren 6 ay içinde', 'Sürenin bitiminden önce en az 3 ay'], a: 1,
        e: 'Kiraya veren, kiralananı kendisi, eşi, altsoyu, üstsoyu veya bakmakla yükümlü olduğu kişiler için konut ihtiyacı nedeniyle kullanma zorunluluğu varsa, belirli süreli sözleşmelerde sürenin sonunda, sürenin bitiminden başlayarak bir ay içinde açacağı davayla sözleşmeyi sona erdirebilir.', r: 'TBK m.350' },
      { q: 'Ev sahibi tahliye davası açmadan önce ne yapmak zorundadır?', o: ['Noter ihtarı', 'Arabulucuya başvurmak (dava şartı)', 'Kira tespit davası açmak', 'Hiçbir şey'], a: 1,
        e: 'Kira ilişkisinden kaynaklanan uyuşmazlıklarda, ilamsız icra yoluyla tahliyeye ilişkin hükümler hariç, dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır. Kural 1 Eylül 2023\'ten beri uygulanıyor.', r: 'HUAK m.18/B (7445 s. K.)' }
    ]
  },
  {
    id: 'b2', b: 'borclar', title: 'Kardeşe Kefalet', court: 'Bursa 12. İcra Dairesi', esas: '2026/18834 Esas', role: 'Kefil vekili', zorluk: 2,
    intro: "Müvekkil Serkan T., evli. Kardeşinin şirketinin banka kredisine bankanın hazır matbu formunu imzalayarak kefil oldu. Formda azami kefalet tutarı ve tarih matbu olarak yazılı; müvekkilin el yazısıyla yazılmış bir şey yok. Eşinin rızası alınmamış. Banka müvekkile karşı ilamsız icra takibi başlattı.",
    evidence: [

        e: 'Kefalet sözleşmesi yazılı yapılmadıkça ve kefilin sorumlu olacağı azami miktar ile kefalet tarihi belirtilmedikçe geçerli olmaz. Kefilin azami miktarı, kefalet tarihini ve müteselsil kefalet hâlinde bu sıfatını kendi el yazısıyla belirtmesi şarttır.', r: 'TBK m.583/1' },
      { q: 'Evli müvekkilin kefaleti için eşin rızası gerekir mi?', o: ['Hayır, kefalet kişiseldir', 'Evet; ayrılık kararı yoksa eşin yazılı rızası gerekir (kanundaki istisnalar saklı)', 'Yalnızca konut kredisinde', 'Sadece sözlü rıza yeterli'], a: 1,
        e: 'Eşlerden biri, mahkemece verilmiş bir ayrılık kararı olmadıkça veya yasal olarak ayrı yaşama hakkı doğmadıkça, ancak diğerinin yazılı rızasıyla kefil olabilir; rıza en geç sözleşmenin kurulması anında verilmelidir. Kanunda bazı ticari ve mesleki faaliyetler için istisnalar vardır.', r: 'TBK m.584/1' },
      { q: 'Sözleşmede oran yoksa 2026\'da kanuni faiz nasıl belirlenir?', o: ['Sabit yıllık yüzde 9', 'TCMB\'nin önceki yıl 31 Aralık kısa vadeli kredi reeskont oranının yüzde 80\'i', 'Ticari avans faizinin iki katı', 'Hâkimin takdiriyle'], a: 1, t: 20,
        e: 'AYM, eski kanuni faiz hükmünü sözleşmeden kaynaklanmayan borçlar bakımından iptal etmişti. 7589 sayılı Kanunla kanuni faiz, TCMB\'nin önceki yıl 31 Aralık reeskont oranının yüzde 80\'ine bağlandı; 30 Haziran\'daki oran 5 puan veya daha fazla farklıysa yılın ikinci yarısında o oran esas alınır.', r: '3095 s. K. m.1 (7589 s. K.) · AYM E.2024/24, K.2025/164' },
      { q: 'Kefalet geçersiz bulunursa, banka müvekkile kefalet sözleşmesine dayanarak neyi talep edebilir?', o: ['Borcun tamamını', 'Yarısını', 'Hiçbir şeyi; geçersiz kefalet kefili bağlamaz', 'Yalnızca faizi'], a: 2,
        e: 'Şekil şartlarına uyulmadan yapılan kefalet sözleşmesi geçersizdir ve kefile bu sözleşmeye dayanılarak bir sorumluluk yüklenemez.', r: 'TBK m.583' }
    ]
  },
  {
    id: 'b3', b: 'borclar', title: 'Yaya Geçidinde', court: 'Antalya 4. Asliye Hukuk Mahkemesi', esas: '2026/2041 E.', role: 'Davacı vekili', zorluk: 3,
    intro: "Müvekkil Elif S., 5 Ağustos 2026'da yaya geçidinden karşıya geçerken kırmızı ışıkta geçen bir aracın çarpması sonucu bacağından ağır yaralandı. Sürücü kusurlu. Müvekkil serbest muhasebeci; 5 ay çalışamadı ve kalıcı yüzde 12 maluliyet raporu aldı. Dava dilekçesinde yalnızca maddi tazminat istendi.",
    evidence: [
      ['Kaza tespit tutanağı', 'Sürücü tam kusurlu; yaya kusursuz.'],
      ['Adli tıp raporu', 'Kalıcı yüzde 12 iş gücü kaybı.'],
      ['Dava dilekçesi', 'Yalnızca maddi tazminat (geçici ve sürekli iş göremezlik) talep edilmiş; manevi tazminat talebi yok.']
    ],
    steps: [
      { q: 'Haksız fiilden doğan tazminat için zamanaşımı nedir?', o: ['1 yıl', 'Zararı ve tazminat yükümlüsünü öğrenmeden itibaren 2 yıl, her hâlde fiilden itibaren 10 yıl', '5 yıl', '20 yıl'], a: 1,
        e: 'Tazminat istemi, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten başlayarak iki yıl ve her hâlde fiilin işlendiği tarihten başlayarak on yıl geçmekle zamanaşımına uğrar. Fiil ceza kanunlarında daha uzun zamanaşımı öngörülen bir suç ise o süre uygulanır.', r: 'TBK m.72/1' },
      { q: 'Aşağıdakilerden hangisi haksız fiil sorumluluğunun unsurlarından değildir?', o: ['Hukuka aykırı fiil', 'Zarar ve illiyet bağı', 'Kusur', 'Taraflar arasında sözleşme bulunması'], a: 3,
        e: 'Kusurlu ve hukuka aykırı bir fiille başkasına zarar veren, bu zararı gidermekle yükümlüdür. Haksız fiil sorumluluğu sözleşme ilişkisi gerektirmez.', r: 'TBK m.49/1' },

  { id: "qi29", b: "is", q: "İznini işyerinin bulunduğu yerden başka bir yerde geçirecek işçiye ne verilmelidir?", o: ["Ücretli 7 gün yol izni", "Talep ederse toplam 4 güne kadar ücretsiz yol izni", "Yol parası", "Hiçbir şey"], a: 1, e: "Yıllık iznini işyerinin kurulu bulunduğu yerden başka bir yerde geçirecek işçilere, istemde bulunmaları ve bu hususu belgelemeleri koşuluyla gidiş ve dönüşlerinde toplam dört güne kadar ücretsiz yol izni verilmesi zorunludur.", r: "İş K. m.56/4" },
  { id: "qi30", b: "is", q: "Fazla çalışma karşılığında işçi ücret yerine serbest zaman isterse her fazla saat için ne kadar serbest zaman verilir?", o: ["1 saat", "1 saat 30 dakika", "2 saat", "45 dakika"], a: 1, e: "Fazla çalışma yapan işçi isterse bu çalışmalar karşılığında zamlı ücret yerine, her fazla çalışma saati için bir saat otuz dakika serbest zaman kullanabilir.", r: "İş K. m.41/4" },
  { id: "qi31", b: "is", q: "Kaç yaşını doldurmamış çocukların çalıştırılması kural olarak yasaktır?", o: ["12", "15 (14 yaşını doldurmuş ve zorunlu eğitimi tamamlamışlar hafif işlerde çalışabilir)", "16", "18"], a: 1, e: "On beş yaşını doldurmamış çocukların çalıştırılması yasaktır. Ancak on dört yaşını doldurmuş ve zorunlu temel eğitimini tamamlamış çocuklar, gelişmelerine ve okullarına engel olmayacak hafif işlerde çalıştırılabilir.", r: "İş K. m.71/1" },
  { id: "qi32", b: "is", q: "Ciddi ve yakın bir tehlikeyle karşılaşan çalışan ne yapabilir?", o: ["Hiçbir şey, çalışmaya devam eder", "Durumun tespiti için başvurabilir; tedbir alınana kadar çalışmaktan kaçınabilir", "Derhal tazminatsız istifa etmek zorundadır", "Yalnızca polise haber verir"], a: 1, e: "Ciddi ve yakın tehlikeyle karşı karşıya kalan çalışanlar, kurula veya işverene başvurarak durumun tespit edilmesini isteyebilir; gerekli tedbir alınıncaya kadar çalışmaktan kaçınabilir. Bu sürede ücretleri ve diğer hakları saklıdır.", r: "6331 s. K. m.13" },
  // AİLE
  { id: "qa21", b: "aile", q: "Aşağıdakilerden hangisiyle evlenmek kanunen yasak değildir?", o: ["Kardeş", "Teyze", "Teyze çocuğu (kuzen)", "Üvey ana"], a: 2, e: "Üstsoy ile altsoy, kardeşler, amca, dayı, hala ve teyze ile yeğenler arasında ve sıhrî hısımlar arasında (üstsoy-altsoy) evlenme yasaktır. Kuzenler arasında yasal evlenme engeli yoktur.", r: "TMK m.129" },
  { id: "qa22", b: "aile", q: "Akıl hastalığı sebebiyle boşanma için ne aranır?", o: ["Yalnızca tanık", "Ortak hayatın çekilmez hâle gelmesi ve hastalığın geçmeyeceğinin resmî sağlık kurulu raporuyla tespiti", "Hastanın rızası", "En az 1 yıl hastanede kalması"], a: 1, e: "Eşlerden biri akıl hastası olup bu yüzden ortak hayat diğer eş için çekilmez hâle gelirse ve hastalığın geçmesine olanak bulunmadığı resmî sağlık kurulu raporuyla tespit edilirse boşanma davası açılabilir.", r: "TMK m.165" },
  { id: "qa23", b: "aile", q: "Boşanmadan doğan dava hakları (tazminat, nafaka gibi) ne zaman zamanaşımına uğrar?", o: ["Boşanma hükmünün kesinleşmesinden itibaren 1 yıl", "5 yıl", "10 yıl", "Süresiz"], a: 0, e: "Evliliğin boşanma sebebiyle sona ermesinden doğan dava hakları, boşanma hükmünün kesinleşmesinin üzerinden bir yıl geçmekle zamanaşımına uğrar.", r: "TMK m.178" },
  { id: "qa24", b: "aile", q: "Boşanan kadın kural olarak hangi soyadını kullanır?", o: ["Eski eşinin soyadını", "Evlenmeden önceki soyadını; menfaati varsa hâkim eski eşin soyadını kullanmasına izin verebilir", "İstediği soyadını", "Çocuğunun soyadını"], a: 1, e: "Boşanan kadın evlenmeden önceki soyadını yeniden kazanır. Kadının boşandığı kocasının soyadını kullanmasında menfaati bulunduğu ve kocaya zarar vermeyeceği ispat edilirse hâkim izin verir.", r: "TMK m.173" },
  { id: "qa25", b: "aile", q: "Ortak hayat nedeniyle kişiliği veya ekonomik güvenliği ciddi tehlikeye düşen eşin hakkı nedir?", o: ["Hiçbir hak yok", "Tehlike sürdükçe ayrı yaşama hakkı", "Derhal boşanma kararı", "Diğer eşi evden çıkarma hakkı (yalnızca 6284 ile)"], a: 1, e: "Ortak hayat sebebiyle kişiliği, ekonomik güvenliği veya ailenin huzuru ciddi biçimde tehlikeye düşen eş, bu tehlike sürdükçe ayrı yaşama hakkına sahiptir.", r: "TMK m.197/1" },
  { id: "qa26", b: "aile", q: "Eşlerden biri diğerine ait malın edinilmesine karşılıksız katkıda bulunduysa tasfiyede ne ister?", o: ["Hiçbir şey", "Katkısı oranında değer artış payı", "Malın tamamını", "Yalnızca verdiği paranın faizini"], a: 1, e: "Eşlerden biri diğerine ait bir malın edinilmesine, iyileştirilmesine veya korunmasına hiç ya da uygun karşılık almaksızın katkıda bulunmuşsa, tasfiye sırasında bu malda meydana gelen değer artışı için katkısı oranında alacak hakkına sahiptir.", r: "TMK m.227/1" },
  { id: "qa27", b: "aile", q: "Eşin ölümüyle mal rejimi sona erdi. Sağ kalan eş aile konutu için ne isteyebilir?", o: ["Hiçbir şey", "Katılma alacağına mahsuben konut üzerinde intifa veya oturma hakkı (ya da mülkiyet) tanınmasını", "Konutun satılmasını", "Kira bedeli"], a: 1, e: "Sağ kalan eş, birlikte yaşadıkları ve ölen eşe ait olan konut üzerinde, katılma alacağına mahsup edilmek üzere intifa veya oturma hakkı tanınmasını isteyebilir; haklı sebepler varsa mülkiyet hakkı da tanınabilir.", r: "TMK m.240" },
  { id: "qa28", b: "aile", q: "Evlilik devam ederken velayeti kim kullanır?", o: ["Yalnızca baba", "Yalnızca anne", "Ana ve baba birlikte", "Mahkemenin seçtiği eş"], a: 2, e: "Evlilik devam ettiği sürece ana ve baba velayeti birlikte kullanırlar.", r: "TMK m.336/1" },
  { id: "qa29", b: "aile", q: "Küçüğün evlat edinilebilmesi için evlat edinenin ona ne kadar süre bakmış olması gerekir?", o: ["3 ay", "6 ay", "1 yıl", "2 yıl"], a: 2, e: "Küçüğün evlat edinilebilmesi için, evlat edinen tarafından bir yıl süreyle bakılıp eğitilmiş olması şarttır.", r: "TMK m.305/1" },
  { id: "qa30", b: "aile", q: "Eşlerin birlikte evlat edinebilmesi için hangi koşul aranır?", o: ["En az 1 yıl evli olmak", "En az 5 yıldan beri evli olmak veya 30 yaşını doldurmuş olmak", "En az 40 yaşında olmak", "Çocuksuz olmak"], a: 1, e: "Eşler ancak birlikte evlat edinebilirler. Bunun için en az beş yıldan beri evli olmaları veya otuz yaşını doldurmuş olmaları gerekir.", r: "TMK m.306" },
  { id: "qa31", b: "aile", q: "Evlat edinen, evlatlıktan en az kaç yaş büyük olmalıdır?", o: ["10", "15", "18", "21"], a: 2, e: "Evlat edinen her durumda evlatlıktan en az on sekiz yaş büyük olmalıdır.", r: "TMK m.308/1" },
  { id: "qa32", b: "aile", q: "İrat biçimindeki nafaka hangi durumlarda kendiliğinden kalkar?", o: ["Yalnızca mahkeme kararıyla", "Alacaklının yeniden evlenmesi veya taraflardan birinin ölümüyle", "5 yıl geçince", "Borçlunun işsiz kalmasıyla"], a: 1, e: "Nafaka alacaklısının yeniden evlenmesi veya taraflardan birinin ölümü hâlinde irat kendiliğinden kalkar. Evlenmeksizin fiilen evliymiş gibi yaşama gibi hâllerde ise mahkeme kararıyla kaldırılır.", r: "TMK m.176/3" },
  // İDARE
  { id: "qd18", b: "idare", q: "Aşağıdakilerden hangisi idari yargıda dilekçenin ilk incelemesinde incelenen hususlardan biri değildir?", o: ["Görev ve yetki", "Süre aşımı", "İşlemin esas yönünden hukuka uygunluğu", "Husumet"], a: 2, e: "İlk incelemede görev ve yetki, idari merci tecavüzü, ehliyet, kesin ve yürütülmesi gereken bir işlem olup olmadığı, süre aşımı, husumet ve dilekçenin usule uygunluğu incelenir. Esas inceleme sonraki aşamadır.", r: "İYUK m.14/3" },
  { id: "qd19", b: "idare", q: "Adli yargının görevine giren bir dava idare mahkemesinde açılırsa ne olur?", o: ["İdare mahkemesi esastan karar verir", "Dava görev yönünden reddedilir", "Dosya Yargıtay'a gönderilir", "Dava düşer, harç iade edilmez"], a: 1, e: "İlk inceleme sonunda adli yargının görevine giren davaların görev yönünden reddine karar verilir; idari yargı içindeki görev ve yetki uyuşmazlıklarında ise dosya görevli ve yetkili mahkemeye gönderilir.", r: "İYUK m.15/1-a" },
  { id: "qd20", b: "idare", q: "İdari yargıda inceleme nasıl yapılır?", o: ["Yalnızca tarafların getirdiği delillerle", "Mahkeme her türlü incelemeyi kendiliğinden (re'sen) yapar", "Yalnızca bilirkişi raporuyla", "Duruşma zorunludur"], a: 1, e: "Danıştay, idare ve vergi mahkemeleri bakmakta oldukları davalara ait her türlü incelemeyi kendiliğinden yaparlar (re'sen araştırma ilkesi).", r: "İYUK m.20/1" },
  { id: "qd21", b: "idare", q: "Birden fazla idari işleme karşı tek dilekçeyle dava açılabilir mi?", o: ["Hayır, hiçbir zaman", "Kural olarak her işleme ayrı dava açılır; aralarında maddi veya hukuki bağlılık ya da sebep-sonuç ilişkisi varsa tek dilekçe olabilir", "Evet, sınırsız", "Yalnızca vergi davalarında"], a: 1, e: "Her idari işlem aleyhine ayrı ayrı dava açılır. Ancak aralarında maddi veya hukuki yönden bağlılık ya da sebep-sonuç ilişkisi bulunan işlemlere karşı tek dilekçeyle de dava açılabilir.", r: "İYUK m.5/1" },
  { id: "qd22", b: "idare", q: "HSK'nın hangi kararlarına karşı yargı yolu açıktır?", o: ["Tüm kararlarına", "Yalnızca meslekten çıkarma cezasına ilişkin kararlarına", "Hiçbirine", "Yalnızca atama kararlarına"], a: 1, e: "Hâkimler ve Savcılar Kurulunun meslekten çıkarma cezasına ilişkin kararları dışındaki kararlarına karşı yargı mercilerine başvurulamaz.", r: "AY m.159" },
  { id: "qd23", b: "idare", q: "Devletin işlemlerinde ilgililere bildirmesi gereken husus hangisidir?", o: ["İşlemi yapan memurun adı", "Hangi kanun yollarına ve mercilere başvurulacağı ile süreleri", "İşlemin maliyeti", "Bildirim zorunlu değildir"], a: 1, e: "Devlet, işlemlerinde ilgili kişilerin hangi kanun yollarına ve mercilere başvuracağını ve sürelerini belirtmek zorundadır.", r: "AY m.40/2" },
  { id: "qd24", b: "idare", q: "Hizmeti 10 yıldan fazla olan devlet memurunun yıllık izni?", o: ["20 gün", "24 gün", "30 gün", "36 gün"], a: 2, e: "Yıllık izin süresi hizmeti bir yıldan on yıla kadar (on yıl dâhil) olanlar için yirmi gün, hizmeti on yıldan fazla olanlar için otuz gündür.", r: "657 s. K. m.102" },
  { id: "qd25", b: "idare", q: "Devlet memurluğundan çıkarma cezasını kim verir?", o: ["Disiplin amiri", "Atamaya yetkili amir tek başına", "Yüksek disiplin kurulu", "İdare mahkemesi"], a: 2, e: "Uyarma, kınama, aylıktan kesme ve kademe ilerlemesinin durdurulması cezaları disiplin amirlerince; devlet memurluğundan çıkarma cezası ise memurun bağlı olduğu kurumun yüksek disiplin kurulunca verilir.", r: "657 s. K. m.126" },
  { id: "qd26", b: "idare", q: "Kınama cezası memurun özlük dosyasından ne zaman silinebilir?", o: ["1 yıl sonra", "5 yıl sonra, başvuru üzerine", "10 yıl sonra", "Hiçbir zaman"], a: 1, e: "Uyarma ve kınama cezaları beş yıl, devlet memurluğundan çıkarma dışındaki diğer cezalar on yıl geçtikten sonra memurun başvurusu üzerine; bu sürelerdeki davranışları dikkate alınarak özlük dosyasından silinebilir.", r: "657 s. K. m.133" },
  { id: "qd27", b: "idare", q: "Görevden uzaklaştırılan memura bu süre içinde aylığının ne kadarı ödenir?", o: ["Hiç ödenmez", "Yarısı", "Üçte ikisi", "Tamamı"], a: 2, e: "Görevden uzaklaştırılan memurlara bu süre içinde aylıklarının üçte ikisi ödenir; sosyal hak ve yardımlardan yararlanmaya devam ederler.", r: "657 s. K. m.141" },
  { id: "qd28", b: "idare", q: "Devlet memuru olabilmek için asgari yaş?", o: ["16", "18", "21", "22"], a: 1, e: "Devlet memurluğuna alınacaklarda aranacak genel şartlardan biri on sekiz yaşını bitirmiş olmaktır.", r: "657 s. K. m.48/A" },
  { id: "qd29", b: "idare", q: "Ağır cezalık suçüstü hâlinde memur hakkında soruşturma izni gerekir mi?", o: ["Evet, her durumda", "Hayır; ağır cezayı gerektiren suçüstü hâli genel hükümlere tabidir", "Yalnızca vali izniyle", "Yalnızca bakan izniyle"], a: 1, e: "Ağır cezayı gerektiren suçüstü hâli genel hükümlere tabidir; bu durumda soruşturma izni aranmaz.", r: "4483 s. K. m.2" },
  // BORÇLAR
  { id: "qb20", b: "borclar", q: "Sözleşmelerin geçerliliği kural olarak bir şekle bağlı mıdır?", o: ["Evet, yazılı olmalı", "Hayır; kanunda aksine hüküm yoksa hiçbir şekle bağlı değildir", "Noter onayı şart", "Tanık şart"], a: 1, e: "Sözleşmelerin geçerliliği, kanunda aksine bir hüküm bulunmadıkça hiçbir şekle bağlı değildir.", r: "TBK m.12/1" },
  { id: "qb21", b: "borclar", q: "Ahlaka veya kamu düzenine aykırı sözleşmenin yaptırımı nedir?", o: ["İptal edilebilirlik", "Kesin hükümsüzlük", "Askıda hükümsüzlük", "Geçerli, yalnızca tazminat doğar"], a: 1, e: "Kanunun emredici hükümlerine, ahlaka, kamu düzenine, kişilik haklarına aykırı veya konusu imkânsız olan sözleşmeler kesin olarak hükümsüzdür.", r: "TBK m.27/1" },
  { id: "qb22", b: "borclar", q: "Haksız fiilde zararı ve failin kusurunu kim ispat eder?", o: ["Fail", "Zarar gören", "Mahkeme re'sen", "Sigorta şirketi"], a: 1, e: "Zarar gören, zararını ve zarar verenin kusurunu ispat yükü altındadır.", r: "TBK m.50/1" },
  { id: "qb23", b: "borclar", q: "Karşılıklı sözleşmede borçlu temerrüde düştü, verilen ek süre de sonuçsuz kaldı. Alacaklının seçimlik hakları?", o: ["Yalnızca ifa davası", "İfa + gecikme tazminatı; ifadan vazgeçip müspet zarar; veya sözleşmeden dönüp menfi zarar", "Yalnızca dönme", "Hiçbir hak yok"], a: 1, e: "Alacaklı, ifa ve gecikme tazminatı isteyebileceği gibi, ifadan vazgeçerek ifa edilmemeden doğan zararın (müspet zarar) giderilmesini isteyebilir veya sözleşmeden dönebilir (menfi zarar).", r: "TBK m.125/2" },
  { id: "qb24", b: "borclar", q: "Borçlunun sorumlu tutulamayacağı sebeplerle ifa imkânsızlaşırsa ne olur?", o: ["Borçlu tazminat öder", "Borç sona erer", "Borç iki katına çıkar", "Alacaklı borçluya ceza öder"], a: 1, e: "Borcun ifası borçlunun sorumlu tutulamayacağı sebeplerle imkânsızlaşırsa borç sona erer.", r: "TBK m.136/1" },
  { id: "qb25", b: "borclar", q: "Aşağıdakilerden hangisi zamanaşımını keser?", o: ["Alacaklının borçluya telefon etmesi", "Borçlunun borcu ikrar etmesi veya alacaklının dava açması ya da icra takibi yapması", "Sürenin yarısının dolması", "Tarafların aynı şehirde oturması"], a: 1, e: "Borçlunun borcu ikrar etmesi, alacaklının dava veya def'i yoluyla mahkemeye ya da hakeme başvurması, icra takibinde bulunması veya iflas masasına başvurması zamanaşımını keser; yeni süre işlemeye başlar.", r: "TBK m.154, 156" },
  { id: "qb26", b: "borclar", q: "Hâkim zamanaşımını kendiliğinden dikkate alabilir mi?", o: ["Evet, her zaman", "Hayır; zamanaşımı def'i olarak ileri sürülmelidir", "Yalnızca kira davalarında", "Yalnızca tüketici davalarında"], a: 1, e: "Hâkim, zamanaşımını kendiliğinden göz önüne alamaz.", r: "TBK m.161" },
  { id: "qb27", b: "borclar", q: "Alacağın devri hangi şekle tabidir?", o: ["Şekle tabi değil", "Yazılı şekil", "Resmî şekil", "Noter onayı"], a: 1, e: "Alacağın devri, yazılı şekilde yapılmadıkça geçerli olmaz.", r: "TBK m.184/1" },
  { id: "qb28", b: "borclar", q: "Taşınır satışında yarar ve hasar kural olarak ne zaman alıcıya geçer?", o: ["Sözleşme imzalanınca", "Zilyetliğin devri anında", "Bedel ödenince", "Fatura kesilince"], a: 1, e: "Kanun veya sözleşmede aksi öngörülmedikçe, taşınır satışında yarar ve hasar, malın zilyetliğinin devri anında alıcıya geçer.", r: "TBK m.208/1" },
  { id: "qb29", b: "borclar", q: "Kiracı sözleşme süresinden önce kiralananı boşaltırsa kira borcu ne olur?", o: ["Hemen sona erer", "Benzer koşullarla yeniden kiraya verilebileceği makul bir süre için devam eder", "Sözleşmenin sonuna kadar her durumda devam eder", "İki katına çıkar"], a: 1, e: "Kiracı sözleşme süresine veya fesih dönemine uymaksızın kiralananı geri verirse, borçları kiralananın benzer koşullarla kiraya verilebileceği makul bir süre için devam eder.", r: "TBK m.325/1" },
  { id: "qb30", b: "borclar", q: "Kiralananı sonradan satın alan yeni malik, gereksinim nedeniyle tahliye için ne yapmalıdır?", o: ["Hemen dava açar", "Edinmeden itibaren 1 ay içinde kiracıya yazılı bildirim yapıp 6 ay sonra dava açar", "Kira döneminin bitimini bekler, bildirim gerekmez", "Kiracıyla yeni sözleşme yapmak zorundadır"], a: 1, e: "Kiralananı sonradan edinen kişi, gereksinim varsa edinme tarihinden itibaren bir ay içinde durumu kiracıya yazılı olarak bildirmek koşuluyla sözleşmeyi altı ay sonra açacağı davayla sona erdirebilir.", r: "TBK m.351/1" },
  { id: "qb31", b: "borclar", q: "Vekâlet sözleşmesi ne zaman sona erdirilebilir?", o: ["Yalnızca süre bitince", "Taraflar her zaman dönebilir veya feshedebilir; uygun olmayan zamanda fesih tazminat doğurur", "Yalnızca mahkeme kararıyla", "Hiçbir zaman, ölüme kadar sürer"], a: 1, e: "Vekâlet veren veya vekil, her zaman sözleşmeden dönebilir veya sözleşmeyi feshedebilir. Ancak uygun olmayan zamanda sözleşmeyi sona erdiren taraf, diğerinin bu yüzden uğradığı zararı gidermekle yükümlüdür.", r: "TBK m.512" },
  // MİRAS
  { id: "qm20", b: "miras", q: "Birinci derecede mirasçılar kimlerdir ve nasıl paylaşırlar?", o: ["Kardeşler; eşit", "Altsoy (çocuklar); eşit", "Ana-baba; eşit", "Eş; tamamı"], a: 1, e: "Mirasbırakanın mirasçıları öncelikle altsoyudur. Çocuklar eşit olarak mirasçı olurlar.", r: "TMK m.495/1" },

function rgCardHTML() {

// Kariyer istatistikleri: alan ve kanun bazında isabet
const LAW_NAMES = { 'TMK': 'Türk Medenî Kanunu', 'TBK': 'Türk Borçlar Kanunu', 'TCK': 'Türk Ceza Kanunu', 'CMK': 'Ceza Muhakemesi Kanunu', 'İş K.': 'İş Kanunu', 'İYUK': 'İdari Yargılama Usulü K.', 'İİK': 'İcra ve İflas Kanunu', 'TTK': 'Türk Ticaret Kanunu', 'AY': 'Anayasa', 'HMK': 'Hukuk Muhakemeleri K.', '657 s. K.': 'Devlet Memurları K. (657)', '1475 s. K.': 'Kıdem tazminatı (1475)', '7036 s. K.': 'İş Mahkemeleri K. (7036)', '6284 s. K.': 'Ailenin Korunması K. (6284)', '6502 s. K.': 'Tüketicinin Korunması K. (6502)', '4483 s. K.': 'Memurların Yargılanması K. (4483)', '2942 s. K.': 'Kamulaştırma K. (2942)' };
function lawKey(r) {
  const first = String(r || '').split('·')[0].trim();
  const mm = /^(.*?)\s+m\.\s*/.exec(first);
  if (mm) return mm[1].replace(/\s*\(.*$/, '').trim();
  if (/^Yargıtay/.test(first)) return 'Yargıtay içtihadı';
  if (/^Danıştay/.test(first)) return 'Danıştay içtihadı';
  if (/^(AYM|Anayasa)/.test(first)) return 'AYM kararları';
  return 'Diğer';
}
const lawName = k => LAW_NAMES[k] || k;
function statMark(it, ok) {
  if (!S.me) return;
  const st = S.me.st || (S.me.st = { b: {}, l: {} });
  const add = (o, k) => { const e = o[k] || (o[k] = { a: 0, c: 0 }); e.a++; if (ok) e.c++; };
  add(st.b, it.b); add(st.l, lawKey(it.r));
}
const pct = e => e && e.a ? Math.round(e.c / e.a * 100) : 0;

// Günlük hatırlatma (yalnızca Android uygulaması): önümüzdeki 14 gün için yerel bildirim
const REM_TIMES = ['09:00', '13:00', '20:00', '21:30'];
const LN = () => { const C = window.Capacitor; return APP && C && C.Plugins && C.Plugins.LocalNotifications ? C.Plugins.LocalNotifications : null; };
async function scheduleReminders() {
  const ln = LN(); if (!ln) return;
  try {
    await ln.cancel({ notifications: Array.from({ length: 14 }, (_, i) => ({ id: 7001 + i })) });
    if (!prefs.rem || S.guest || !S.me) return;
    const [h, mi] = prefs.rem.split(':').map(Number), st = dailyState(), now = new Date(), list = [];
    for (let k = 0; k < 14; k++) {
      const d = new Date(); d.setDate(d.getDate() + k); d.setHours(h, mi, 0, 0);
      if (d <= now || (k === 0 && st.done)) continue;
      const streak = k === 0 ? st.streak : k === 1 && st.done ? st.streak : 0;
      list.push({ id: 7001 + k, title: 'Celse · Günün dosyası',
        body: streak > 0 ? `${streak} günlük serin var. Bugünün dosyasını kapat, seriyi sürdür.` : 'Yeni günün dosyası hazır; birkaç dakikanı alır.',
        schedule: { at: d, allowWhileIdle: true }, smallIcon: 'ic_stat_celse', iconColor: '#8E1B30' });
    }
    if (list.length) await ln.schedule({ notifications: list });
  } catch (e) { /* bildirim izni yoksa sessizce geç */ }
}
async function setReminder(t, errEl) {
  const ln = LN(); if (!ln) return;
  if (t) {
    try {
      let p = await ln.checkPermissions();
      if (p.display !== 'granted') p = await ln.requestPermissions();
      if (p.display !== 'granted') { if (errEl) errEl.textContent = 'Bildirim izni verilmedi. Telefonun Ayarlar → Uygulamalar → Celse → Bildirimler bölümünden açabilirsin.'; return false; }
    } catch (e) { if (errEl) errEl.textContent = 'Bildirim ayarlanamadı.'; return false; }
  }
  prefs.rem = t || null; ls.set('celse.prefs', prefs);
  await scheduleReminders();
  return true;
}
function reminderHTML() {
  if (!LN() || S.guest) return '';
  return `<section class="panel"><h3>Günlük hatırlatma</h3>
    <p class="note" style="margin:0">Günün dosyasını kaçırmaman için seçtiğin saatte telefonuna bildirim gelir. O günün dosyasını bitirdiysen bildirim gelmez. İnternet gerekmez.</p>
    ${segHTML('rem', prefs.rem || 'off', [['off', 'Kapalı'], ...REM_TIMES.map(t => [t, t])])}
    <div class="err" id="remerr"></div></section>`;
}

// Süreler modu: süre soran ve şıklarında süre bulunan hızlı sorular
const DUR_RE = /\d+\s*(gün|iş günü|ay|yıl|hafta|saat)\b|\b(bir|iki|üç|altı|yedi|on|otuz)\s+(gün|ay|yıl|hafta)\b/i;
const SURE_EXTRA = ['qe5'];
const isSure = q => SURE_EXTRA.includes(q.id) || (/(süre|zamanaşımı|kaç gün|ne zaman|en geç|hangi süre|ne kadar)/i.test(q.q) && q.o.filter(o => DUR_RE.test(o)).length >= 2);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- Kurulum ----------
async function boot() {
  let db = null, user = null;
  try { if (window.claude && claude.use) { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } } catch (e) {}
  S.db = db; S.user = user;
  if (user) { try { S.uid = await user.id(); } catch (e) {} }
  if (!db || !S.uid) { S.local = true; }
  if (user) { try { const c = await user.can('data.write'); if (c === false) S.canWrite = false; } catch (e) {} }
  if (user) { try { S.isOwner = await user.isOwner(); } catch (e) {} }

  if (S.local) {
    S.me = ls.get('celse.me', null);
    S.players = S.me ? [{ id: 'local', ...S.me }] : [];
    S.uid = 'local';
    S.me ? enter() : renderGate();
    return;
  }
  // Oyuncu tablosuna tek abonelik
  let first = true;
  db.collection('players').orderBy('total', 'desc').limit(500).onSnapshot(snap => {
    S.players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const mine = S.players.find(p => p.id === S.uid);
    if (mine && !S.guest) S.me = { ...blank(mine.name), ...mine };
    if (first) { first = false; S.me ? enter() : renderGate(); }
    else { paintChip(); if (!S.game && (S.tab === 'ligler' || S.tab === 'yonetim')) render(); }
  }, () => { if (first) { first = false; S.local = true; S.me = ls.get('celse.me', null); S.me ? enter() : renderGate(); } });
  // Yasaklı hesaplar
  db.collection('bans').onSnapshot(snap => {
    S.bans = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    if (!S.game && S.me && (S.tab === 'ligler' || S.tab === 'yonetim')) render();
  }, () => {});
  // Çevrimiçi göstergesi
  claude.use('room').then(room => {
    if (!room) return; S.room = room;
    room.onPeers(ch => { S.online = ch.peers.length; paintOnline(); });
    if (S.me) room.presence({ n: S.me.name }).catch(() => {});
  }).catch(() => {});
}

function paintOnline() {
  const el = $('#online'); if (!S.online) { el.hidden = true; return; }
  el.hidden = false; el.textContent = S.online + ' çevrimiçi';
}
function paintChip() {
  if (!S.me) return;
  $('#mechip').hidden = false;
  $('#me-av').textContent = (S.me.name || '?').slice(0, 1).toLocaleUpperCase('tr-TR');
  $('#me-name').textContent = S.me.name;
  $('#me-pts').textContent = S.guest ? '' : fmt(S.me.total) + ' p';
}

function renderGate() {
  $('#tabs').hidden = true;
  app.innerHTML = `

    <label for="uname" class="eyebrow">Kullanıcı adı</label>
    <input class="txt" id="uname" maxlength="18" autocomplete="off" placeholder="ör. av_deniz" required>
    <div class="note">3–18 karakter: harf, rakam ve alt çizgi. Kullanıcı adın skor tablosunda görünür ve sonradan değiştirilemez.</div>
    ${consentHTML()}
    <div class="err" id="gerr"></div>
    <button class="btn wide" id="gbtn">Kayıt ol ve başla</button>
    <div class="or"><span>veya</span></div>
    <button type="button" class="btn ghost wide" id="guestbtn">Misafir olarak oyna</button>

  </form>`;
  $('#gate').addEventListener('submit', async ev => {
    ev.preventDefault();
    const raw = $('#uname').value.trim();
    const err = $('#gerr');
    if (!/^[\p{L}\p{N}_]{3,18}$/u.test(raw)) { err.textContent = 'Kullanıcı adı 3–18 karakter olmalı; yalnızca harf, rakam ve alt çizgi kullan.'; return; }
    if (badName(raw)) { err.textContent = 'Bu kullanıcı adı Kullanım Koşulları\'na uygun değil. Başka bir ad seç.'; return; }
    const cErr = consentError(); if (cErr) { err.textContent = cErr; return; }
    $('#gbtn').disabled = true; err.textContent = '';
    if (S.local) { S.me = { ...blank(raw), consent: consentRecord() }; ls.set('celse.me', S.me); S.players = [{ id: 'local', ...S.me }]; enter(); return; }
    if (!S.canWrite) { err.textContent = 'Bu arenaya yalnızca görüntüleme erişimin var. Puan kaydetmek için sayfa sahibinden "Katkıda bulunan" erişimi iste.'; $('#gbtn').disabled = false; return; }
    try {
      const key = raw.toLocaleLowerCase('tr-TR');
      const ref = S.db.doc('usernames/' + key);
      const lease = await ref.acquire({ holder: S.uid, ttlMs: 5000 });
      if (!lease.acquired) { err.textContent = 'Bu ad şu anda başka biri tarafından alınıyor. Başka bir ad dene.'; $('#gbtn').disabled = false; return; }
      const cur = await ref.get();
      const owner = cur.exists && cur.data().uid;
      if (owner && owner !== S.uid) { err.textContent = 'Bu kullanıcı adı alınmış. Başka bir ad dene.'; $('#gbtn').disabled = false; return; }
      if (!owner) await ref.set({ uid: S.uid });
      S.me = { ...blank(raw), consent: consentRecord() };
      await S.db.doc('players/' + S.uid).set(S.me);
      if (S.room) S.room.presence({ n: raw }).catch(() => {});
      enter();
    } catch (e) {
      err.textContent = 'Kayıt yapılamadı. Bağlantını kontrol edip tekrar dene.'; $('#gbtn').disabled = false;
    }
  });
  $('#guestbtn').addEventListener('click', () => {
    const err = $('#gerr');
    const cErr = consentError(); if (cErr) { err.textContent = cErr; return; }
    startGuest();
  });
  bindLegalLinks();
  setTimeout(() => $('#uname') && $('#uname').focus(), 50);
