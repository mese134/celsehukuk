name: Android derleme

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Ubuntu 24.04 imajında Android SDK hazır gelir (ubuntu-latest Ubuntu 26'ya geçiyor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK'yı kontrol et
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK bulunamadı"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Bağımlılıkları kur ve oyunu derle
        run: |
          npm ci
          python3 tools/build.py
          npx cap sync android

      - name: İmza anahtarını hazırla
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.CELSE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::İmza anahtarı (CELSE_KEYSTORE_B64) girilmemiş. Yalnızca test APK'sı derlenecek; Play Store paketi için Settings > Secrets and variables > Actions bölümünden dört gizli değeri ekleyin."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test APK'sı derle (imzasız kurulum için)
        if: steps.key.outputs.signed == 'false'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Play Store paketi (.aab) ve imzalı APK derle
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          CELSE_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          CELSE_KEYSTORE_PASSWORD: ${{ secrets.CELSE_KEYSTORE_PASSWORD }}
          CELSE_KEY_ALIAS: ${{ secrets.CELSE_KEY_ALIAS }}
          CELSE_KEY_PASSWORD: ${{ secrets.CELSE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'false'
        with:
          name: celse-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: celse-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
