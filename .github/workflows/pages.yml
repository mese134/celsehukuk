name: Web sitesi

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Resmî Gazete 00.00'da yayımlanır (UTC+3). 00.20, 09.00 ve 15.00'te yenilenir (mükerrer sayılar için).
    - cron: '20 21 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Siteyi derle
        run: |
          npm ci
          python3 tools/build.py

      - name: Resmî Gazete fihristini al
        continue-on-error: true
        timeout-minutes: 6
        run: python3 tools/rg.py site/rg.json --debug rg-debug

      - name: Fihrist ham sayfalarını sakla (inceleme için)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rg-debug
          path: |
            rg-debug
            site/rg.json
          retention-days: 3
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
