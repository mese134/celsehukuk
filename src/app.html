<title>Celse Arenası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap&subset=latin-ext">
<style>
/* Düzen: tek sütunlu oyun alanı; üstte yapışkan duruşma çubuğu, altında sekmeler ve dosya kartları */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#e2e6ec; --ink:#151b26; --muted:#5a6476; --line:#d3d9e2;
  --accent:#8e1b30; --accent-ink:#ffffff; --accent-soft:#f5e3e6;
  --brass:#9a6c12; --brass-soft:#f6ecd6;
  --ok:#17784a; --ok-soft:#dff1e7; --bad:#b3262d; --bad-soft:#f8e0e1;
  --f-display:"Spectral", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#171d28; --sunk:#111621; --ink:#e7ebf1; --muted:#97a1b3; --line:#283141;
  --accent:#e5627a; --accent-ink:#1a0a0e; --accent-soft:#3a1720;
  --brass:#e3b553; --brass-soft:#33280f;
  --ok:#4cc68b; --ok-soft:#12301f; --bad:#f06b6f; --bad-soft:#3a1517; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#171d28; --sunk:#111621; --ink:#e7ebf1; --muted:#97a1b3; --line:#283141;
  --accent:#e5627a; --accent-ink:#1a0a0e; --accent-soft:#3a1720;
  --brass:#e3b553; --brass-soft:#33280f;
  --ok:#4cc68b; --ok-soft:#12301f; --bad:#f06b6f; --bad-soft:#3a1517; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Üst çubuk */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.online{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.online::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip-me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px 4px 4px;min-width:0}
.chip-me .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.chip-me span{font-weight:600;font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-me em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--brass)}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap{display:flex;gap:2px;padding-block:0}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:420px){.tab{padding:10px 8px;font-size:13px}.brand small{display:none}.chip-me span{max-width:90px}}
.chip-me em{white-space:nowrap}

main{padding-block:20px 48px}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted)}
.fine{font-size:11.5px;line-height:1.45;color:var(--muted);margin:2px 0 0;text-align:center}

/* Profil şeridi */
.profile{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.profile h2{font-size:26px}
.tier{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--brass);background:var(--brass-soft);padding:3px 8px;border-radius:4px}
.pts{text-align:right}
.pts b{display:block;font-family:var(--f-mono);font-size:28px;color:var(--brass);line-height:1}
.pts span{font-size:12px;color:var(--muted)}
.prog{grid-column:1/-1}
.prog .track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog .fill{height:100%;background:var(--brass);border-radius:3px;transition:width .6s}
.prog .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:700}

/* Branş seçici */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Dava kartları */
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.cases{grid-template-columns:1fr}}
.case{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:border-color .15s, transform .15s}
.case:hover{border-color:var(--accent);transform:translateY(-1px)}
.case .court{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.case h3{font-size:20px}
.case .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.dots{letter-spacing:2px;color:var(--brass)}

/* Dosya ekranı */
.docket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.docket header{padding:18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.docket header .tc{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.docket header h2{font-size:28px}
.docket .row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.docket .row b{color:var(--ink);font-weight:600}
.docket .facts{padding:18px;max-width:68ch}
.docket .facts p{margin:0}
.ev{display:grid;gap:0;border-top:1px solid var(--line)}
.ev div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.ev div:last-child{border-bottom:0}
.ev dt{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);padding-top:2px}
.ev dd{margin:0}
@media (max-width:560px){.ev div{grid-template-columns:1fr;gap:2px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* Oyun ekranı */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hud .step{font-family:var(--f-mono);font-size:12px;color:var(--muted);}
.hud .score{margin-left:auto;font-family:var(--f-mono);font-weight:700;color:var(--brass);font-size:18px}
.hud .streak{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:700}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
@media (max-width:560px){.stage{grid-template-columns:1fr}}
.clock{position:relative;width:84px;height:84px;flex:none}
.clock svg{width:84px;height:84px;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:7}
.clock .bgc{stroke:var(--sunk)}
.clock .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke .2s}
.clock.warn .fg{stroke:var(--bad)}
.clock b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:24px}
.clock.warn b{color:var(--bad)}
@media (max-width:560px){.clock{width:64px;height:64px}.clock svg{width:64px;height:64px}.clock b{font-size:19px}}
.qhead{display:flex;flex-direction:column;gap:6px;min-width:0}
.qhead h2{font-size:22px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:15px;transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt kbd{font-family:var(--f-mono);font-size:12px;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:var(--bg)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right kbd{border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong kbd{border-color:var(--bad);color:var(--bad)}
.verdict{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;border:1px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.no{background:var(--bad-soft);border-color:var(--bad)}
.verdict h3{font-size:19px}
.verdict.ok h3{color:var(--ok)} .verdict.no h3{color:var(--bad)}
.verdict p{margin:0;max-width:68ch}
.ref{align-self:flex-start;font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:4px}
details.file{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.file summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
details.file .inner{padding:0 14px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}

/* Sonuç */
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px}
.result .big{font-family:var(--f-mono);font-size:48px;font-weight:700;color:var(--brass);line-height:1}
.result h2{font-size:30px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:8px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-size:18px}
.recap{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.recap div{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.recap div:last-child{border-bottom:0}
.recap .y{color:var(--ok);font-weight:700}.recap .n{color:var(--bad);font-weight:700}
.promo{background:var(--brass-soft);color:var(--brass);border-radius:8px;padding:12px 14px;font-weight:700}

/* Ligler */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ladder div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ladder div.me{border-color:var(--brass);background:var(--brass-soft)}
.ladder b{font-family:var(--f-display);font-size:15px;line-height:1.15}
.ladder span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:560px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board table{width:100%;border-collapse:collapse;font-size:14px}
.board th{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:left;font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line)}
.board td{padding:10px 14px;border-bottom:1px solid var(--line)}
.board tr:last-child td{border-bottom:0}
.board td.n,.board th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.board td.rk{font-family:var(--f-mono);color:var(--muted);width:44px}
.board tr.me td{background:var(--accent-soft)}
.board tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.board .nm{font-weight:600;overflow-wrap:anywhere}
.board .tt{font-size:12px;color:var(--muted)}
.medal{color:var(--brass);font-weight:700}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* Düello */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.code{font-family:var(--f-mono);font-size:34px;font-weight:700;color:var(--accent)}
input.txt{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input.code-in{font-family:var(--f-mono);font-size:20px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;text-align:center}
.vs .side{background:var(--bg);border-radius:8px;padding:14px;min-width:0}
.vs .side b{display:block;font-family:var(--f-mono);font-size:28px;color:var(--brass)}
.vs .side span{font-weight:600;overflow-wrap:anywhere}
.vs .side.win{outline:2px solid var(--brass)}
.vs i{font-family:var(--f-display);font-style:normal;font-weight:700;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:10px 12px;font-size:14px}
.list button:last-child{border-bottom:0}

/* Giriş */
.gate{max-width:440px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:14px}
.gate h1{font-size:40px;letter-spacing:-.01em}
.gate h1 i{font-style:normal;color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.banner{background:var(--brass-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13.5px}

/* Yasal metinler, pencere, onay kutuları, yönetim */
.legal{max-width:72ch;font-size:14.5px}
.legal h3{font-size:20px;margin:18px 0 6px}
.legal h4{font-family:var(--f-body);font-size:15px;font-weight:700;margin:16px 0 4px}
.legal p{margin:0 0 10px}
.legal ul,.legal ol{margin:0 0 10px;padding-left:22px}
.legal li{margin:2px 0}
.legal a{color:var(--accent)}
.tblwrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:8px}
.tblwrap table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
.tblwrap th,.tblwrap td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.tblwrap th{background:var(--bg);font-weight:600}
.tblwrap tr:last-child td{border-bottom:0}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.modal .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:780px;max-height:88vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:14px}}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:20px}
.modal .body{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.checks{display:flex;flex-direction:column;gap:10px}
.checks label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;line-height:1.45}
.checks input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.timeset{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.timeset .note{flex:1 1 220px;margin:0}
.flag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--bad-soft);color:var(--bad);margin:2px 4px 2px 0}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.adm{display:flex;flex-direction:column;gap:10px}
.adm .row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.adm .row .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.adm details{font-size:12.5px}
.adm .glog{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--bad);color:#fff}
textarea.txt{font:inherit;font-size:14px;width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.report{display:flex;flex-direction:column;gap:8px;align-self:stretch}

.daily{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:16px 18px}
.daily h3{font-family:var(--f-display);font-size:22px;margin:2px 0 4px}
.daily .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--muted)}
.daily .dstreak{text-align:center;min-width:72px}
.daily .dstreak b{display:block;font-family:var(--f-display);font-size:34px;line-height:1;color:var(--brass)}
.daily .dstreak span{font-size:12px;color:var(--muted)}
.daily .actions{grid-column:1/-1;margin:0}
.nbstrip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14px}
.study{display:grid;gap:14px}
.study .panel h3{font-family:var(--f-display);font-size:21px;margin:0}
.nbcount{display:flex;gap:18px;flex-wrap:wrap}
.nbcount div{display:flex;flex-direction:column}

<div class="bar" id="bar">
  <div class="wrap">
    <button class="brand" id="home-btn" aria-label="Ana sayfa"><b>Cel<i>se</i></b><small>Hukuk Arenası</small></button>
    <span class="online" id="online" hidden></span>
    <div class="chip-me" id="mechip" hidden><span class="av" id="me-av"></span><span id="me-name"></span><em id="me-pts"></em></div>
  </div>
  <nav class="tabs" id="tabs" hidden><div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="davalar">Davalar</button>
    <button class="tab" role="tab" data-tab="hizli">Hızlı Duruşma</button>
    <button class="tab" role="tab" data-tab="calis">Çalış</button>
    <button class="tab" role="tab" data-tab="duello">Düello</button>
    <button class="tab" role="tab" data-tab="ligler">Ligler</button>
    <button class="tab" role="tab" data-tab="kaynaklar">Kaynaklar</button>
    <button class="tab" role="tab" data-tab="yasal">Yasal</button>
    <button class="tab" role="tab" data-tab="yonetim" hidden>Yönetim</button>
  </div></nav>
</div>
<main class="wrap" id="app"><p class="muted" style="padding-top:20px">Arena hazırlanıyor…</p></main>

<script>
/*DATA*/
</script>
<script>
(() => {
const APP = !!window.CELSE_APP;   // Play Store sürümü: çevrimdışı, veriler cihazda
const BR = { ceza: 'Ceza', is: 'İş', aile: 'Aile', idare: 'İdare', borclar: 'Borçlar', miras: 'Miras', icra: 'İcra ve İflas', ticaret: 'Ticaret' };
const BKEYS = Object.keys(BR);
const TIERS = [
  { ad: 'Stajyer', min: 0 }, { ad: 'Avukat', min: 1500 }, { ad: 'Kıdemli Avukat', min: 4000 },
  { ad: 'Hâkim', min: 8000 }, { ad: 'Yargıtay Üyesi', min: 15000 }
];
const DEF_T = 15;
const QUICK_N = 8, DUEL_N = 6;
const TIME_MODES = { normal: { k: 1, ad: 'Normal' }, uzun: { k: 2, ad: 'Uzatılmış' }, genis: { k: 3, ad: 'Geniş' } };
const DAY_CAP = 10000;      // günlük lig puanı sınırı
const FAST_MS = 500;        // insan tepki süresinin altı
const MAX_Q = 350;          // bir sorudan alınabilecek en yüksek puan (100 + 150 süre + 100 seri)
const REPEAT_MS = 864e5;    // aynı hızlı soru 24 saat içinde tekrar gelirse yarım puan
const S = { db: null, user: null, uid: null, me: null, players: [], tab: 'davalar', branch: 'ceza', qbranch: 'karisik',
  board: 'lig', online: 0, room: null, local: false, canWrite: true, game: null, duelUnsub: null, isOwner: false, bans: {}, guest: false };
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n || 0).toLocaleString('tr-TR');
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const prefs = Object.assign({ time: 'normal' }, ls.get('celse.prefs', {}));
const tMult = () => (TIME_MODES[prefs.time] || TIME_MODES.normal).k;
const qSecs = t => (t || DEF_T) * tMult();
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function weekKey(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return t.getUTCFullYear() + '-H' + String(Math.ceil(((t - y0) / 864e5 + 1) / 7)).padStart(2, '0');
}
const tierOf = pts => { let t = 0; TIERS.forEach((x, i) => { if (pts >= x.min) t = i; }); return t; };
const blank = name => ({ name, total: 0, ceza: 0, is: 0, aile: 0, idare: 0, borclar: 0, miras: 0, icra: 0, ticaret: 0, games: 0, answered: 0, correct: 0, bestStreak: 0, week: weekKey(), weekPts: 0, cases: {} });
const weekPts = p => (p && p.week === weekKey()) ? (p.weekPts || 0) : 0;
// Hata defteri: yanlış → hemen tekrar; doğru bildikçe 1, 3, 7 gün sonra; dördüncü doğruda defterden çıkar
const NB_DAYS = [0, 1, 3, 7];
function findItem(id) {
  const q = QUICK.find(x => x.id === id); if (q) return q;
  const mm = /^(.+)-(\d+)$/.exec(id); const c = mm && CASES.find(x => x.id === mm[1]);
  return c && c.steps[+mm[2]] ? { ...c.steps[+mm[2]], id, b: c.b, cid: c.id } : null;
}
function nbMark(it, ok) {
  if (!S.me) return;
  const nb = S.me.nb || (S.me.nb = {}), e = nb[it.id], now = Date.now();
  if (!ok) { nb[it.id] = { box: 0, due: now }; return; }
  if (e && e.due <= now) { const box = e.box + 1; if (box >= NB_DAYS.length) delete nb[it.id]; else nb[it.id] = { box, due: now + NB_DAYS[box] * 864e5 }; }
}
const nbAll = () => Object.entries((S.me && S.me.nb) || {}).filter(([id]) => findItem(id));
const nbDue = () => nbAll().filter(([, e]) => e.due <= Date.now());
// Günün dosyası: tarihe göre herkese aynı dosya
const dayOffset = (k) => { const d = new Date(); d.setDate(d.getDate() + k); return dayKey(d); };
function dailyCase() { const d = new Date(); const n = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); return CASES[(n * 7 + 3) % CASES.length]; }
function dailyState() {
  const dl = (S.me && S.me.daily) || {};
  const alive = dl.last === dayKey() || dl.last === dayOffset(-1);
  return { done: dl.last === dayKey(), streak: alive ? (dl.streak || 0) : 0, best: dl.best || 0 };
}
// Süreler modu: süre soran ve şıklarında süre bulunan hızlı sorular
const DUR_RE = /\d+\s*(gün|iş günü|ay|yıl|hafta|saat)\b|\b(bir|iki|üç|altı|yedi|on|otuz)\s+(gün|ay|yıl|hafta)\b/i;
const SURE_EXTRA = ['qe5'];
const isSure = q => SURE_EXTRA.includes(q.id) || (/(süre|zamanaşımı|kaç gün|ne zaman|en geç|hangi süre|ne kadar)/i.test(q.q) && q.o.filter(o => DUR_RE.test(o)).length >= 2);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- Kurulum ----------
async function boot() {
  let db = null, user = null;
  try { if (window.claude && claude.use) { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } } catch (e) {}
  S.db = db; S.user = user;
  if (user) { try { S.uid = await user.id(); } catch (e) {} }
  if (!db || !S.uid) { S.local = true; }
  if (user) { try { const c = await user.can('data.write'); if (c === false) S.canWrite = false; } catch (e) {} }
  if (user) { try { S.isOwner = await user.isOwner(); } catch (e) {} }

  if (S.local) {
    S.me = ls.get('celse.me', null);
    S.players = S.me ? [{ id: 'local', ...S.me }] : [];
    S.uid = 'local';
    S.me ? enter() : renderGate();
    return;
  }
  // Oyuncu tablosuna tek abonelik
  let first = true;
  db.collection('players').orderBy('total', 'desc').limit(500).onSnapshot(snap => {
    S.players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const mine = S.players.find(p => p.id === S.uid);
    if (mine && !S.guest) S.me = { ...blank(mine.name), ...mine };
    if (first) { first = false; S.me ? enter() : renderGate(); }
    else { paintChip(); if (!S.game && (S.tab === 'ligler' || S.tab === 'yonetim')) render(); }
  }, () => { if (first) { first = false; S.local = true; S.me = ls.get('celse.me', null); S.me ? enter() : renderGate(); } });
  // Yasaklı hesaplar
  db.collection('bans').onSnapshot(snap => {
    S.bans = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    if (!S.game && S.me && (S.tab === 'ligler' || S.tab === 'yonetim')) render();
  }, () => {});
  // Çevrimiçi göstergesi
  claude.use('room').then(room => {
    if (!room) return; S.room = room;
    room.onPeers(ch => { S.online = ch.peers.length; paintOnline(); });
    if (S.me) room.presence({ n: S.me.name }).catch(() => {});
  }).catch(() => {});
}

function paintOnline() {
  const el = $('#online'); if (!S.online) { el.hidden = true; return; }
  el.hidden = false; el.textContent = S.online + ' çevrimiçi';
}
function paintChip() {
  if (!S.me) return;
  $('#mechip').hidden = false;
  $('#me-av').textContent = (S.me.name || '?').slice(0, 1).toLocaleUpperCase('tr-TR');
  $('#me-name').textContent = S.me.name;
  $('#me-pts').textContent = S.guest ? '' : fmt(S.me.total) + ' p';
}

// ---------- Giriş ----------
function renderGate() {
  $('#tabs').hidden = true;
  app.innerHTML = `
  <form class="gate" id="gate">
    <span class="eyebrow">Türk mevzuatıyla süreli duruşma oyunu</span>
    <h1>Cel<i>se</i>'ye hoş geldin</h1>
    <p class="muted" style="margin:0">Ceza, iş, aile, idare, borçlar, miras, icra-iflas ve ticaret hukuku dosyalarında karar ver. Her karar için 15 saniyen var; istersen süreyi uzatabilirsin. Doğru ve hızlı kararlar puan getirir, puanın seni Stajyer liginden Yargıtay Üyesi ligine taşır.</p>
    <label for="uname" class="eyebrow">Kullanıcı adı</label>
    <input class="txt" id="uname" maxlength="18" autocomplete="off" placeholder="ör. av_deniz" required>
    <div class="note">3–18 karakter: harf, rakam ve alt çizgi. Kullanıcı adın skor tablosunda görünür ve sonradan değiştirilemez.</div>
    ${consentHTML()}
    <div class="err" id="gerr"></div>
    <button class="btn wide" id="gbtn">Kayıt ol ve başla</button>
    <div class="or"><span>veya</span></div>
    <button type="button" class="btn ghost wide" id="guestbtn">Misafir olarak oyna</button>
    <p class="fine">Misafir modunda puanların saklanmaz ve ligde yer almazsın. Celse eğitim ve eğlence amaçlıdır; hukuki danışmanlık değildir.${S.local ? ' Puanların yalnızca bu cihazda tutulur; ortak lig yakında.' : ''}</p>
  </form>`;
  $('#gate').addEventListener('submit', async ev => {
    ev.preventDefault();
    const raw = $('#uname').value.trim();
    const err = $('#gerr');
    if (!/^[\p{L}\p{N}_]{3,18}$/u.test(raw)) { err.textContent = 'Kullanıcı adı 3–18 karakter olmalı; yalnızca harf, rakam ve alt çizgi kullan.'; return; }
    if (badName(raw)) { err.textContent = 'Bu kullanıcı adı Kullanım Koşulları\'na uygun değil. Başka bir ad seç.'; return; }
    const cErr = consentError(); if (cErr) { err.textContent = cErr; return; }
    $('#gbtn').disabled = true; err.textContent = '';
    if (S.local) { S.me = { ...blank(raw), consent: consentRecord() }; ls.set('celse.me', S.me); S.players = [{ id: 'local', ...S.me }]; enter(); return; }
    if (!S.canWrite) { err.textContent = 'Bu arenaya yalnızca görüntüleme erişimin var. Puan kaydetmek için sayfa sahibinden "Katkıda bulunan" erişimi iste.'; $('#gbtn').disabled = false; return; }
    try {
      const key = raw.toLocaleLowerCase('tr-TR');
      const ref = S.db.doc('usernames/' + key);
      const lease = await ref.acquire({ holder: S.uid, ttlMs: 5000 });
      if (!lease.acquired) { err.textContent = 'Bu ad şu anda başka biri tarafından alınıyor. Başka bir ad dene.'; $('#gbtn').disabled = false; return; }
      const cur = await ref.get();
      const owner = cur.exists && cur.data().uid;
      if (owner && owner !== S.uid) { err.textContent = 'Bu kullanıcı adı alınmış. Başka bir ad dene.'; $('#gbtn').disabled = false; return; }
      if (!owner) await ref.set({ uid: S.uid });
      S.me = { ...blank(raw), consent: consentRecord() };
      await S.db.doc('players/' + S.uid).set(S.me);
      if (S.room) S.room.presence({ n: raw }).catch(() => {});
      enter();
    } catch (e) {
      err.textContent = 'Kayıt yapılamadı. Bağlantını kontrol edip tekrar dene.'; $('#gbtn').disabled = false;
    }
  });
  $('#guestbtn').addEventListener('click', () => {
    const err = $('#gerr');
    const cErr = consentError(); if (cErr) { err.textContent = cErr; return; }
    startGuest();
  });
  bindLegalLinks();
  setTimeout(() => $('#uname') && $('#uname').focus(), 50);
}
function startGuest() {
  S.guest = true;
  S.me = { ...blank('Misafir'), consent: consentRecord() };
  enter();
}
function exitGuest() {
  S.guest = false; S.me = null; leaveGame(); S.tab = 'davalar';
  $('#mechip').hidden = true;
  // Daha önce kayıtlı bir profil varsa ona dön
  if (S.local) { const saved = ls.get('celse.me', null); if (saved) { S.me = saved; enter(); return; } }
  else { const mine = S.players.find(p => p.id === S.uid); if (mine) { S.me = { ...blank(mine.name), ...mine }; enter(); return; } }
  renderGate();
}
function guestBanner() {
  if (!S.guest) return '';
  return `<div class="banner" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><b>Misafir modundasın.</b> Puanların kaydedilmez ve ligde yer almazsın; sayfa kapanınca her şey silinir.</span><button class="btn sm" data-exitguest>Kayıt ol</button></div>`;
}
function bindGuest() { document.querySelectorAll('[data-exitguest]').forEach(b => b.addEventListener('click', exitGuest)); }

function enter() {
  $('#tabs').hidden = false; paintChip();
  document.querySelector('[data-tab=yonetim]').hidden = !S.isOwner || S.guest;
  if (needsConsent()) { renderConsent(); return; }
  render();
}

// ---------- Kaydetme ----------
let saveChain = Promise.resolve();
function persist() {
  if (S.guest) return;
  const doc = JSON.parse(JSON.stringify(S.me)); delete doc.id;
  if (S.local) { ls.set('celse.me', doc); S.players = [{ id: 'local', ...doc }]; return; }
  if (!S.canWrite || S.bans[S.uid]) return;
  saveChain = saveChain.then(() => S.db.doc('players/' + S.uid).set(doc)).catch(() => {});
}

// ---------- Gezinme ----------
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { if (leaveGame()) { S.tab = t.dataset.tab; render(); } }));
$('#home-btn').addEventListener('click', () => { if (S.me && leaveGame()) { S.tab = 'davalar'; render(); } });
function leaveGame() { stopTimer(); S.game = null; if (S.duelUnsub) { S.duelUnsub(); S.duelUnsub = null; } return true; }

function render() {
  S.sub = null;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
  window.scrollTo(0, 0);
  ({ davalar: renderCases, hizli: renderQuick, calis: renderStudy, duello: renderDuel, ligler: renderLeagues, kaynaklar: renderSources, yasal: renderLegal, yonetim: renderAdmin })[S.tab]();
}

function profileHTML() {
  const m = S.me, ti = tierOf(m.total), next = TIERS[ti + 1];
  const pct = next ? Math.min(100, (m.total - TIERS[ti].min) / (next.min - TIERS[ti].min) * 100) : 100;
  const acc = m.answered ? Math.round(m.correct / m.answered * 100) : 0;
  return `<section class="profile">
    <div class="stack" style="gap:6px"><span class="tier">${esc(TIERS[ti].ad)} Ligi</span><h2>${esc(m.name)}</h2></div>
    <div class="pts"><b>${fmt(m.total)}</b><span>toplam puan</span></div>
    <div class="prog"><div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="lbl"><span>${esc(TIERS[ti].ad)}</span><span>${next ? fmt(next.min - m.total) + ' puan sonra ' + esc(next.ad) : 'En üst lig'}</span></div></div>
    <div class="stats"><span>Bu hafta <b>${fmt(weekPts(m))}</b></span><span>İsabet <b>%${acc}</b></span><span>En uzun seri <b>${m.bestStreak || 0}</b></span>
      ${BKEYS.map(k => `<span>${BR[k]} <b>${fmt(m[k])}</b></span>`).join('')}</div>
  </section>`;
}
function segHTML(id, cur, opts) {
  return `<div class="seg" id="${id}">${opts.map(([k, v]) => `<button aria-pressed="${k === cur}" data-k="${k}">${esc(v)}</button>`).join('')}</div>`;
}
function bindSeg(id, fn) { document.querySelectorAll('#' + id + ' button').forEach(b => b.addEventListener('click', () => fn(b.dataset.k))); }

// ---------- Davalar ----------
function renderCases() {
  const list = CASES.filter(c => c.b === S.branch);
  const best = S.me.cases || {};
  app.innerHTML = `<div class="stack">
    ${S.local && !S.guest ? (APP ? '<div class="banner">Puanların bu cihazda saklanıyor. Ortak lig ve düello bir sonraki sürümde.</div>' : '<div class="banner">Yerel moddasın: puanların yalnızca bu tarayıcıda tutulur ve skor tablosuna gitmez.</div>') : ''}
    ${!S.local && !S.canWrite ? '<div class="banner">Görüntüleme erişimin var; oynayabilirsin ama puanın kaydedilmez. Sayfa sahibinden "Katkıda bulunan" erişimi iste.</div>' : ''}
    ${guestBanner()}
    ${S.guest ? '' : banBanner()}
    ${dailyHTML()}
    ${nbDue().length ? `<div class="nbstrip"><span>Hata defterinde <b>${nbDue().length}</b> soru tekrar bekliyor.</span><button class="btn sm" id="nbgo">Tekrar et</button></div>` : ''}
    ${profileHTML()}
    ${timeSetHTML()}
    <div class="stack" style="gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap">
        <div><span class="eyebrow">Dava dosyaları</span><h2 style="font-size:24px">Bir dosya seç, duruşmayı yönet</h2></div>
        ${segHTML('br', S.branch, Object.entries(BR).map(([k, v]) => [k, v + ' Hukuku']))}
      </div>
      <div class="cases">${list.map(c => `
        <button class="case" data-id="${c.id}">
          <span class="court">${esc(c.court)} · ${esc(c.esas)}</span>
          <h3>${esc(c.title)}</h3>
          <span class="meta"><span class="pill">${esc(c.role)}</span><span>${c.steps.length} karar</span><span class="dots" title="Zorluk">${'●'.repeat(c.zorluk)}${'○'.repeat(3 - c.zorluk)}</span>
          ${best[c.id] != null ? `<span class="pill done">En iyi ${fmt(best[c.id])}</span>` : ''}</span>
        </button>`).join('')}</div>
      <p class="note">Bir dosyayı tekrar oynayabilirsin; lige yalnızca önceki en iyi skorunu aşan kısım eklenir. Mevzuat ve içtihat son kontrolü: ${LAST_CHECK}.</p>
    </div></div>`;
  bindSeg('br', k => { S.branch = k; renderCases(); });
  bindTimeSet(renderCases); bindGuest();
  if ($('#dgo')) $('#dgo').addEventListener('click', () => renderBrief(dailyCase(), { daily: !dailyState().done }));
  if ($('#nbgo')) $('#nbgo').addEventListener('click', startReview);
  document.querySelectorAll('.case').forEach(b => b.addEventListener('click', () => renderBrief(CASES.find(c => c.id === b.dataset.id))));
}

function dailyHTML() {
  const c = dailyCase(), st = dailyState();
  const today = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' });
  return `<section class="daily">
    <div><span class="eyebrow">Günün dosyası · ${esc(today)}</span><h3>${esc(c.title)}</h3>
      <div class="meta"><span class="pill">${esc(BR[c.b])} Hukuku</span><span>${esc(c.role)}</span><span>${c.steps.length} karar</span></div></div>
    <div class="dstreak"><b>${st.streak}</b><span>günlük seri</span></div>
    <div class="actions">${st.done ? `<span class="note" style="margin:0">Bugünün dosyasını kapattın. Yarın yeni dosya gelecek; seriyi sürdürmek için yarın da oyna.</span><button class="btn ghost sm" id="dgo">Yeniden oku</button>`
      : `<button class="btn" id="dgo">Dosyayı aç</button><span class="note" style="margin:0">Günün dosyasını bitirince seri bonusu: +${100 + 20 * Math.min(st.streak, 10)}</span>`}</div>
  </section>`;
}

function renderBrief(c, extra = {}) {
  S.sub = 'brief';
  app.innerHTML = `<div class="stack">
    <button class="btn ghost" id="back" style="align-self:flex-start">← Dosyalar</button>
    ${extra.daily ? '<div class="banner"><b>Günün dosyası.</b> Bitirdiğinde günlük seri bonusu kazanırsın.</div>' : ''}
    <article class="docket">
      <header>
        <span class="tc">T.C. ${esc(c.court)}</span>
        <h2>${esc(c.title)}</h2>
        <div class="row"><span>Esas No: <b class="mono">${esc(c.esas)}</b></span><span>Rolün: <b>${esc(c.role)}</b></span><span>Branş: <b>${BR[c.b]} Hukuku</b></span></div>
      </header>
      <div class="facts"><span class="eyebrow">Olay</span><p>${esc(c.intro)}</p></div>
      <dl class="ev" style="margin:0">${c.evidence.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    </article>

// ---------- Oyun motoru ----------
let timer = null;
function stopTimer() { if (timer) { cancelAnimationFrame(timer.raf); timer = null; } }

// Şıkların sırası her oyunda karışır (düelloda iki oyuncu için aynı sıra)
function mix(it, seed) {
  let h = 2166136261; for (const ch of it.id + '|' + seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const perm = it.o.map((_, i) => i);
  for (let i = perm.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  return { ...it, o: perm.map(i => it.o[i]), a: perm.indexOf(it.a) };
}
function startGame(mode, items, extra = {}) {
  const seed = extra.duelCode || String(Math.random());
  items = items.map(it => mix(it, seed));
  S.game = { mode, items, idx: 0, score: 0, streak: 0, maxStreak: 0, correct: 0, log: [], times: [], fast: 0, repeats: 0, started: Date.now(), byBranch: Object.fromEntries(BKEYS.map(k => [k, 0])), ...extra };
  renderQuestion();
}

function renderQuestion() {
  const g = S.game, it = g.items[g.idx], T = qSecs(it.t);
  const c = g.caseObj || (it.cid ? CASES.find(x => x.id === it.cid) : null);
  const modeName = { review: 'Hata defteri', sure: 'Süreler' }[g.mode] || 'Hızlı duruşma';
  app.innerHTML = `<div class="stack">
    <div class="hud"><span class="step">${g.mode === 'case' ? 'Karar' : 'Soru'} ${g.idx + 1}/${g.items.length} · ${BR[it.b]}</span>
      ${g.streak > 1 ? `<span class="streak">${g.streak} seri</span>` : ''}<span class="score">${fmt(g.score)}</span></div>
    ${c ? `<details class="file"><summary>Dosyayı göster · ${esc(c.title)}</summary><div class="inner"><p style="margin:0">${esc(c.intro)}</p>${c.evidence.map(([k, v]) => `<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join('')}</div></details>` : ''}
    <section class="stage">
      <div class="clock" id="clock"><svg viewBox="0 0 84 84"><circle class="bgc" cx="42" cy="42" r="36"/><circle class="fg" id="arc" cx="42" cy="42" r="36" stroke-dasharray="226.2" stroke-dashoffset="0"/></svg><b id="secs">${T}</b></div>
      <div class="qhead"><span class="eyebrow">${g.mode === 'review' ? 'Hata defteri · ' + (c ? esc(c.title) : esc(BR[it.b]) + ' Hukuku') : c ? esc(c.role) + ' olarak karar ver' : modeName}${tMult() > 1 ? ' · ' + esc(TIME_MODES[prefs.time].ad) + ' süre' : ''}</span><h2>${esc(it.q)}</h2></div>
    </section>
    <div class="opts" id="opts">${it.o.map((o, i) => `<button class="opt" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
  const start = performance.now(), dur = T * 1000;
  stopTimer();
  timer = { start, dur, done: false };
  const tick = now => {
    if (!timer || timer.done) return;
    const left = Math.max(0, dur - (now - start));
    const arc = $('#arc'), secs = $('#secs');
    if (arc) { arc.style.strokeDashoffset = String(226.2 * (1 - left / dur)); secs.textContent = Math.ceil(left / 1000); $('#clock').classList.toggle('warn', left < 5000); }
    if (left <= 0) { answer(-1); return; }
    timer.raf = requestAnimationFrame(tick);
  };
  timer.raf = requestAnimationFrame(tick);
}

function answer(i) {
  const g = S.game; if (!g || !timer || timer.done) return;
  timer.done = true; cancelAnimationFrame(timer.raf);
  const it = g.items[g.idx];
  const ms = performance.now() - timer.start;
  const frac = Math.max(0, timer.dur - ms) / timer.dur;
  const ok = i === it.a;
  const fast = i >= 0 && ms < FAST_MS;
  const recent = (S.me.recent || {})[it.id];
  const repeat = g.mode !== 'case' && recent && Date.now() - recent < REPEAT_MS;
  let pts = 0;
  if (ok) {
    g.streak++; g.maxStreak = Math.max(g.maxStreak, g.streak); g.correct++;
    pts = fast ? 100 : 100 + Math.ceil(frac * 15) * 10 + Math.min(100, 20 * (g.streak - 1));
    if (repeat) pts = Math.round(pts / 2);
  } else g.streak = 0;
  nbMark(it, ok);
  if (i >= 0) g.times.push(Math.round(ms));
  if (fast) g.fast++;
  if (repeat) g.repeats++;
  g.score += pts; g.byBranch[it.b] += pts;
  g.log.push({ q: it.q, ok, pts, timeout: i < 0, fast, repeat });
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true; const bi = +b.dataset.i;
    if (bi === it.a) b.classList.add('right'); else if (bi === i) b.classList.add('wrong');
  });
  const last = g.idx === g.items.length - 1;
  $('#fb').innerHTML = `<div class="verdict ${ok ? 'ok' : 'no'}">
    <h3>${ok ? 'İsabetli karar · +' + pts : (i < 0 ? 'Süre doldu' : 'Hatalı karar')}</h3>
    <p>${esc(it.e)}</p><span class="ref">${esc(it.r)}</span>
    ${fast && ok ? '<p class="note" style="margin:0">Cevap insan tepki süresinin altında verildiği için hız ve seri bonusu uygulanmadı.</p>' : ''}
    ${repeat && ok ? '<p class="note" style="margin:0">Bu soruyu son 24 saatte gördün; yarım puan verildi.</p>' : ''}
    <div class="actions"><button class="btn" id="next">${last ? 'Kararı tefhim et' : 'Sonraki ' + (g.mode === 'case' ? 'karar' : 'soru')} →</button>
    <button class="btn ghost sm" id="rep">Hata bildir</button></div><div id="repbox"></div></div>`;
  $('.hud .score').textContent = fmt(g.score);
  $('#next').addEventListener('click', next);
  $('#rep').addEventListener('click', () => openReport(it));
  $('#next').focus({ preventScroll: true });
  $('#fb').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}

function next() {
  const g = S.game; if (!g) return;
  if (g.idx < g.items.length - 1) { g.idx++; renderQuestion(); } else finish();
}

document.addEventListener('keydown', e => {
  if (!S.game || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (timer && !timer.done && /^[1-4]$/.test(e.key)) { const i = +e.key - 1; if (i < S.game.items[S.game.idx].o.length) answer(i); }
  else if (timer && timer.done && e.key === 'Enter' && $('#next')) { e.preventDefault(); next(); }
});

function finish() {
  const g = S.game; stopTimer();
  const m = S.me, beforeTier = tierOf(m.total);
  if (g.mode === 'case' && g.correct === g.items.length) { g.score += 100; g.byBranch[g.caseObj.b] += 100; g.perfect = true; }
  // Teorik üst sınır: bunu aşan bir sonuç bellekte değiştirilmiş demektir
  const cap = g.items.length * MAX_Q + 100;
  if (g.score > cap || Date.now() - g.started < g.items.length * FAST_MS) { g.score = 0; BKEYS.forEach(k => { g.byBranch[k] = 0; }); g.voided = true; }
  let award = Object.fromEntries(BKEYS.map(k => [k, 0]));
  if (g.mode === 'case') {
    const prev = (m.cases || {})[g.caseObj.id] || 0;
    award[g.caseObj.b] = Math.max(0, g.score - prev);
    m.cases = { ...(m.cases || {}), [g.caseObj.id]: Math.max(prev, g.score) };
  } else if (g.mode === 'review') {
    // Tekrar modu öğrenme içindir; lig puanı getirmez
  } else award = { ...g.byBranch };
  // Günün dosyası: günde bir kez seri bonusu
  if (g.daily && !g.voided) {
    const dl = m.daily || {};
    if (dl.last !== dayKey()) {
      const streak = dl.last === dayOffset(-1) ? (dl.streak || 0) + 1 : 1;
      g.dailyBonus = 100 + 20 * Math.min(streak - 1, 10);
      award[g.caseObj.b] += g.dailyBonus;
      m.daily = { last: dayKey(), streak, best: Math.max(dl.best || 0, streak) };
      g.dailyStreak = streak;
    }
  }
  // Günlük sınır
  if (m.day !== dayKey()) { m.day = dayKey(); m.dayPts = 0; }
  let gained = BKEYS.reduce((t, k) => t + award[k], 0);
  const room = Math.max(0, DAY_CAP - (m.dayPts || 0));
  if (gained > room) {
    let cut = gained - room; g.capped = true;
    for (const k of BKEYS) { const d = Math.min(award[k], cut); award[k] -= d; cut -= d; }
    gained = room;
  }
  if (m.week !== weekKey()) { m.week = weekKey(); m.weekPts = 0; }
  BKEYS.forEach(k => { m[k] = (m[k] || 0) + award[k]; });
  m.total = (m.total || 0) + gained; m.weekPts = (m.weekPts || 0) + gained; m.dayPts = (m.dayPts || 0) + gained;
  m.games = (m.games || 0) + 1; m.answered = (m.answered || 0) + g.items.length; m.correct = (m.correct || 0) + g.correct;
  m.bestStreak = Math.max(m.bestStreak || 0, g.maxStreak);
  // Son 24 saatte görülen hızlı sorular
  const now = Date.now(), rec = {};
  Object.entries(m.recent || {}).forEach(([k, t]) => { if (now - t < REPEAT_MS) rec[k] = t; });
  if (g.mode !== 'case' && g.mode !== 'review') g.items.forEach(it => { rec[it.id] = now; });
  m.recent = rec;
  // Oyun kaydı (son 20): yönetim incelemesi ve tutarlılık kontrolü için
  const t = g.times.length ? g.times : [0];
  m.log = [...(m.log || []), { t: now, mode: g.mode, ref: g.caseObj ? g.caseObj.id : (g.duelCode || 'hizli'), n: g.items.length, c: g.correct,
    s: g.score, aw: gained, fast: g.fast, rep: g.repeats, minMs: Math.min(...t), avgMs: Math.round(t.reduce((x, y) => x + y, 0) / t.length),
    dur: now - g.started, tm: tMult(), after: m.total }].slice(-20);
  persist(); paintChip();
  const afterTier = tierOf(m.total);
  if (g.mode === 'duel') { finishDuel(g); }
  renderResult(g, gained, afterTier > beforeTier ? TIERS[afterTier].ad : null);
}

function renderResult(g, gained, promo) {
  const title = g.mode === 'case' ? (g.correct === g.items.length ? 'Kusursuz duruşma' : g.correct >= g.items.length / 2 ? 'Dosya kapandı' : 'Dosya bozmaya döndü') :
    g.mode === 'duel' ? 'Düello kararın verildi' : g.mode === 'review' ? 'Tekrar bitti' : g.mode === 'sure' ? 'Süreler turu bitti' : 'Hızlı duruşma bitti';
  const left = nbAll().length;
  app.innerHTML = `<div class="stack">
    <section class="result">

      <div class="kv"><div><span>İsabet</span><b>${g.correct}/${g.items.length}</b></div><div><span>En uzun seri</span><b>${g.maxStreak}</b></div><div><span>${g.mode === 'review' ? 'Defterde kalan' : S.guest ? 'Misafir: kaydedilmez' : 'Lige eklenen'}</span><b>${g.mode === 'review' ? left : S.guest ? '—' : '+' + fmt(gained)}</b></div></div>
      ${g.dailyBonus ? `<div class="promo">Günün dosyası kapandı: ${g.dailyStreak} günlük seri, +${g.dailyBonus} bonus.</div>` : ''}
      ${g.mode === 'review' ? '<p class="note" style="margin:0">Tekrar modu lig puanı getirmez. Doğru bildiğin sorular 1, 3 ve 7 gün sonra yeniden sorulur; dördüncü doğruda defterden çıkar.</p>' : ''}
      ${g.mode !== 'review' && g.log.some(l => !l.ok) ? '<p class="note" style="margin:0">Yanlış cevapladığın sorular hata defterine eklendi (Çalış sekmesi).</p>' : ''}
      ${g.perfect ? '<p class="note" style="margin:0">Tüm kararlar isabetli: +100 kusursuz dosya bonusu.</p>' : ''}
      ${g.mode === 'case' && gained === 0 ? '<p class="note" style="margin:0">Önceki en iyi skorunu geçmediğin için lige puan eklenmedi.</p>' : ''}
      ${promo ? `<div class="promo">Terfi ettin: artık ${esc(promo)} Ligi'ndesin.</div>` : ''}
      ${g.voided ? '<div class="banner">Bu oyunun sonucu teorik üst sınırı aştığı veya olanaksız bir hızda tamamlandığı için geçersiz sayıldı.</div>' : ''}
      ${g.capped ? `<div class="banner">Günlük ${fmt(DAY_CAP)} lig puanı sınırına ulaştın; fazlası lige eklenmedi. Yarın yeniden puan toplayabilirsin.</div>` : ''}
      ${g.fast ? `<p class="note" style="margin:0">${g.fast} cevap insan tepki süresinin altında verildi; bu cevaplara hız ve seri bonusu uygulanmadı.</p>` : ''}
      ${S.bans[S.uid] && !S.guest ? '<div class="banner">Hesabın askıya alındığı için puanın kaydedilmedi.</div>' : ''}
      ${guestBanner()}
      <div class="recap">${g.log.map(l => `<div><span class="${l.ok ? 'y' : 'n'}">${l.ok ? '✓' : '✗'}</span><span>${esc(l.q)}</span><span class="mono">${l.timeout ? 'süre' : '+' + l.pts}${l.fast ? ' ⚑' : ''}${l.repeat ? ' ½' : ''}</span></div>`).join('')}</div>
      <div id="duelbox"></div>
      <div class="actions">
        ${g.mode === 'case' ? '<button class="btn" id="again">Yeni dosya</button>' : g.mode === 'quick' ? '<button class="btn" id="again">Tekrar oyna</button>' : g.mode === 'duel' ? '<button class="btn" id="again">Düellolar</button>' : '<button class="btn" id="again">Çalışmaya dön</button>'}
        <button class="btn ghost" id="toleague">Ligleri gör</button>
      </div>
    </section></div>`;
  S.game = null;
  $('#again').addEventListener('click', () => { leaveGame(); S.tab = { case: 'davalar', quick: 'hizli', duel: 'duello' }[g.mode] || 'calis'; render(); });
  $('#toleague').addEventListener('click', () => { leaveGame(); S.tab = 'ligler'; render(); });
  bindGuest();
  if (g.mode === 'duel') watchDuel(g.duelCode, $('#duelbox'));
}

function renderLeagues() {

// ---------- Hukuki metinler ----------
function inlineMd(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(md) {
  const lines = md.split('\n'); let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith('### ')) { out += `<h4>${inlineMd(l.slice(4))}</h4>`; i++; continue; }
    if (l.startsWith('## ')) { out += `<h3>${inlineMd(l.slice(3))}</h3>`; i++; continue; }
    if (l.startsWith('|')) {
      const rows = []; while (i < lines.length && lines[i].startsWith('|')) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      out += `<div class="tblwrap"><table><thead><tr>${head.map(h => `<th>${inlineMd(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;
    }
    if (/^- /.test(l)) { let li = ''; while (i < lines.length && /^- /.test(lines[i])) { li += `<li>${inlineMd(lines[i].slice(2))}</li>`; i++; } out += `<ul>${li}</ul>`; continue; }
    if (/^\d+\. /.test(l)) { let li = ''; while (i < lines.length && /^\d+\. /.test(lines[i])) { li += `<li>${inlineMd(lines[i].replace(/^\d+\. /, ''))}</li>`; i++; } out += `<ol>${li}</ol>`; continue; }
    let para = l; i++;
    while (i < lines.length && lines[i].trim() && !/^(#|\||- |\d+\. )/.test(lines[i])) { para += ' ' + lines[i]; i++; }
    out += `<p>${inlineMd(para)}</p>`;
  }
  return out;
}

function flagsOf(p) {
  const f = [], log = p.log || [];
  const sum = BKEYS.reduce((t, k) => t + (p[k] || 0), 0);
  if (Math.abs(sum - (p.total || 0)) > 0) f.push('Branş toplamı ≠ toplam');
  if (log.length && log[log.length - 1].after !== p.total) f.push('Kayıt dışı puan');
  for (let i = 1; i < log.length; i++) if (log[i].after - log[i].aw !== log[i - 1].after) { f.push('Kayıt zinciri kopuk'); break; }
  if (log.some(l => l.s > l.n * MAX_Q + 100)) f.push('Üst sınır aşımı');
  const n = log.reduce((t, l) => t + l.n, 0), fa = log.reduce((t, l) => t + (l.fast || 0), 0);
  if (n >= 8 && fa / n > 0.25) f.push('Hızlı cevap %' + Math.round(fa / n * 100));
  if (log.some(l => l.dur < l.n * 1200)) f.push('Olağandışı hız');
  if ((p.dayPts || 0) > DAY_CAP) f.push('Günlük sınır aşımı');
  if (weekPts(p) > (p.total || 0)) f.push('Haftalık > toplam');
  const day = log.filter(l => Date.now() - l.t < 36e5).length; if (day >= 15) f.push('Saatte ' + day + ' oyun');
  return f;
}

    <div><span class="eyebrow">Düello</span><h2 style="font-size:28px">Aynı sorular, iki rakip</h2>
      <p class="muted" style="margin:6px 0 0;max-width:62ch">Bir düello aç, kodu rakibine gönder. İkiniz de aynı ${DUEL_N} soruyu ${DEF_T}'er saniyede cevaplarsınız; yüksek skor kazanır.</p></div>
    <div class="two">
      <div class="panel"><span class="eyebrow">Düello aç</span>
        ${segHTML('db', S.qbranch, [['karisik', 'Karışık'], ...Object.entries(BR)])}
        <button class="btn" id="dnew">Kodu oluştur ve oyna</button><div class="err" id="derr1"></div></div>
      <form class="panel" id="djoin"><label class="eyebrow" for="dcode">Koda katıl</label>
        <input class="txt code-in" id="dcode" maxlength="5" autocomplete="off" placeholder="K7Q2M">
        <button class="btn ghost">Düelloya katıl</button><div class="err" id="derr2"></div></form>
    </div>
    <div class="stack" style="gap:8px"><span class="eyebrow">Son düelloların</span><div class="list" id="dlist"><div class="empty">Henüz düello yok.</div></div></div>
  </div>`;
  bindSeg('db', k => { S.qbranch = k; renderDuel(); });
  $('#dnew').addEventListener('click', createDuel);
  $('#djoin').addEventListener('submit', e => { e.preventDefault(); joinDuel($('#dcode').value.trim().toUpperCase(), $('#derr2')); });
  loadDuelList();
}

async function loadDuelList() {
  const codes = myDuels(); if (!codes.length) return;
  const snaps = await Promise.all(codes.map(c => S.db.doc('duels/' + c).get().catch(() => null)));
  const el = $('#dlist'); if (!el) return;
  const rows = snaps.map((s, i) => s && s.exists ? { code: codes[i], ...s.data() } : null).filter(Boolean);
  if (!rows.length) return;
  el.innerHTML = rows.map(d => {
    const meHost = d.host && d.host.uid === S.uid, mine = meHost ? d.host : d.guest, opp = meHost ? d.guest : d.host;
    let st = 'Rakip bekleniyor';
    if (mine && mine.score == null) st = 'Senin sıran';
    else if (opp && opp.score != null && mine) st = mine.score > opp.score ? 'Kazandın ' + fmt(mine.score) + '–' + fmt(opp.score) : mine.score < opp.score ? 'Kaybettin ' + fmt(mine.score) + '–' + fmt(opp.score) : 'Berabere';
    else if (opp) st = 'Rakip oynuyor';
    return `<button data-c="${esc(d.code)}"><span><b class="mono">${esc(d.code)}</b> · ${esc(opp ? opp.name : '—')}</span><span class="muted">${esc(st)}</span></button>`;
  }).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => joinDuel(b.dataset.c, $('#derr2'))));
}

async function createDuel() {
  const err = $('#derr1'); $('#dnew').disabled = true;
  try {
    const pool = QUICK.filter(q => S.qbranch === 'karisik' || q.b === S.qbranch);
    const qids = shuffle(pool).slice(0, DUEL_N).map(q => q.id);
    let code = ''; for (let i = 0; i < 5; i++) code += CODE_CH[Math.floor(Math.random() * CODE_CH.length)];
    await S.db.doc('duels/' + code).set({ branch: S.qbranch, qids, created: Date.now(), host: { uid: S.uid, name: S.me.name, score: null, correct: null }, guest: null });
    rememberDuel(code);
    app.innerHTML = `<div class="stack"><section class="panel" style="align-items:flex-start">
      <span class="eyebrow">Düello kodu</span><div class="code">${code}</div>
      <p style="margin:0">Bu kodu rakibine gönder; Düello sekmesinde "Koda katıl" alanına yazsın. Sen şimdi oynayabilirsin, sonuç ikiniz de bitirince görünür.</p>
      <div class="actions"><button class="btn" id="dplay">Şimdi oyna</button><button class="btn ghost" id="dcopy">Kodu kopyala</button></div>
    </section></div>`;
    $('#dcopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(code); $('#dcopy').textContent = 'Kopyalandı'; } catch (e) { $('#dcopy').textContent = code; } });
    $('#dplay').addEventListener('click', () => playDuel(code, qids, 'host'));
  } catch (e) { err.textContent = 'Düello oluşturulamadı. Tekrar dene.'; $('#dnew').disabled = false; }
}

async function joinDuel(code, err) {
  if (!/^[A-Z0-9]{5}$/.test(code)) { err.textContent = 'Kod 5 karakterden oluşur.'; return; }
  err.textContent = '';
  try {
    const ref = S.db.doc('duels/' + code); const snap = await ref.get();
    if (!snap.exists) { err.textContent = 'Bu kodla bir düello bulunamadı.'; return; }
    const d = snap.data();
    let role = null;
    if (d.host && d.host.uid === S.uid) role = 'host';
    else if (d.guest && d.guest.uid === S.uid) role = 'guest';
    else if (!d.guest) { await ref.update({ guest: { uid: S.uid, name: S.me.name, score: null, correct: null } }); role = 'guest'; }
    else { err.textContent = 'Bu düelloda iki oyuncu zaten var.'; return; }
    rememberDuel(code);
    const mine = role === 'host' ? d.host : d.guest;
    if (mine && mine.score != null) { app.innerHTML = '<div class="stack"><section class="result"><span class="eyebrow">Düello ' + esc(code) + '</span><div id="duelbox"></div><button class="btn ghost" id="dback" style="align-self:flex-start">← Düellolar</button></section></div>'; $('#dback').addEventListener('click', () => { leaveGame(); renderDuel(); }); watchDuel(code, $('#duelbox')); return; }
    playDuel(code, d.qids, role);
  } catch (e) { err.textContent = 'Düelloya bağlanılamadı. Tekrar dene.'; }
}

function playDuel(code, qids, role) {
  const items = qids.map(id => QUICK.find(q => q.id === id)).filter(Boolean);
  startGame('duel', items, { duelCode: code, duelRole: role });
}
function finishDuel(g) {
  S.db.doc('duels/' + g.duelCode).update({ [g.duelRole]: { score: g.score, correct: g.correct } }).catch(() => {});
}
function watchDuel(code, box) {
  if (S.duelUnsub) S.duelUnsub();
  S.duelUnsub = S.db.doc('duels/' + code).onSnapshot(s => {
    if (!s.exists || !box.isConnected) return;
    const d = s.data(), h = d.host || {}, gu = d.guest || null;
    const done = h.score != null && gu && gu.score != null;
    const side = (p, other) => p ? `<div class="side ${done && p.score > other.score ? 'win' : ''}"><span>${esc(p.name)}${p.uid === S.uid ? ' (sen)' : ''}</span><b>${p.score == null ? '…' : fmt(p.score)}</b><small class="muted">${p.score == null ? 'oynuyor' : p.correct + '/' + d.qids.length + ' isabet'}</small></div>` : '<div class="side"><span>Rakip bekleniyor</span><b>—</b><small class="muted">kod: ' + esc(code) + '</small></div>';
    let verdict = 'Rakibin bitirdiğinde sonuç burada görünür.';
    if (done) { const meH = h.uid === S.uid, a = meH ? h.score : gu.score, b = meH ? gu.score : h.score; verdict = a > b ? 'Düelloyu kazandın.' : a < b ? 'Bu düelloyu rakibin aldı.' : 'Düello berabere bitti.'; }
    box.innerHTML = `<div class="stack" style="gap:10px"><span class="eyebrow">Düello ${esc(code)}</span>
      <div class="vs">${side(h, gu || {})}<i>vs</i>${side(gu, h)}</div><p style="margin:0;font-weight:600">${verdict}</p></div>`;
  }, () => {});
}

// Android geri tuşu (yalnızca uygulama sürümünde kullanılır)
window.celseBack = () => {
  const m = document.querySelector('.modal'); if (m) { m.querySelector('#mclose').click(); return true; }
  if (S.game) { leaveGame(); S.tab = 'davalar'; render(); return true; }
  if (S.sub) { render(); return true; }
  if (S.me && S.tab !== 'davalar') { S.tab = 'davalar'; render(); return true; }
  return false;
};
boot();
})();
</script>
